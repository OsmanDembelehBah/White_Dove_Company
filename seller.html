        --bg: #f1f5f9;
        --bg2: #ffffff;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;

        --text3: #94a3b8;

      }
      :root[data-theme="dark"] {
        --bg: #050d1a;
        --bg2: #0d1b30;
        --card: #0d1b30;
        --border: #1a3050;
        --text: #f1f5f9;
        --text2: #94a3b8;
        --text3: #475569;
        --sidebar-bg: #070f1d;
      }

      }
      body {

      .sidebar {

        top: 0;
        display: flex;

        .sidebar .nav-text,

        .sidebar .seller-name {
          display: none;
        }

          padding: 0.6rem 0;

      }

      .wd-card {

        border: 1px solid var(--border);
        border-radius: 16px;
        transition: all 0.25s ease;
      }
      .wd-card:hover {
        border-color: rgba(16, 185, 129, 0.3);
      }

      .wd-input {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 0.65rem 0.875rem;
        font-size: 0.875rem;
        width: 100%;
        outline: none;
        transition: all 0.2s;
      }
      .wd-input:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }

      .nav-item {

        align-items: center;
        gap: 0.75rem;
        padding: 0.65rem 0.85rem;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text2);
        background: transparent;
        border: none;
        width: 100%;
      }
      .nav-item:hover {
        background: var(--bg2);
        color: var(--text);

      }
      .nav-item.active {
        background: rgba(16, 185, 129, 0.14);
        color: #34d399;

      }

      .cat-pill {
        padding: 0.4rem 0.85rem;

        font-size: 0.75rem;
        font-weight: 600;

        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text2);
      }
      .cat-pill:hover {
        color: var(--text);
        border-color: rgba(16, 185, 129, 0.4);
      }
      .cat-pill.active {
        background: #10b981;
        color: white;
        border-color: #10b981;

      }

      .product-card {

    <script>
      const { useState, useEffect, useRef, useMemo } = React;

      // ─── TOAST CONTAINER ──────────────────────────────────────────
      function ToastContainer({ toasts, removeToast }) {
        return React.createElement(
          "div",
          { className: "toast-container" },
          toasts.map((t) =>
            React.createElement(
              "div",
              {
                key: t.id,
                className: "toast",
                style: {
                  borderLeft: "4px solid " + (t.type === "success" ? "#10B981" : t.type === "warning" ? "#F59E0B" : "#3B82F6"),
                },
              },
              React.createElement(
                "span",
                { style: { fontSize: "1.2rem" } },
                t.type === "success" ? "✅" : t.type === "warning" ? "⚠️" : "📦",
              ),
              React.createElement(
                "div",
                { style: { flex: 1 } },
                React.createElement(
                  "div",
                  {
                    style: {
                      fontWeight: 600,
                      fontSize: "0.85rem",
                      color: "var(--text)",
                    },
                  },
                  t.title,

                React.createElement(
                  "div",
                  { style: { fontSize: "0.75rem", color: "var(--text2)" } },
                  t.message,
                ),
              ),
              React.createElement(
                "button",
                {
                  onClick: () => removeToast(t.id),
                  style: {
                    background: "none",
                    border: "none",
                    color: "var(--text3)",
                    cursor: "pointer",
                    fontSize: "1rem",
                  },

      // ─── LOGIN COMPONENT WITH QUICK DEMO ACCOUNTS ──────────────────
      function LoginPage({ onLogin }) {
        const [email, setEmail] = useState("Solutionswhitedoveelectrical@gmail.com");
        const [password, setPassword] = useState("Whitedove2026");
        const [showPw, setShowPw] = useState(false);
        const [error, setError] = useState("");

        const handleDemoClick = (demEmail, demPw) => {

          setPassword(demPw);
          setError("");

          e.preventDefault();
          setLoading(true);
          setError("");

          setTimeout(() => {
            const res = window.WD_STORE ? window.WD_STORE.authenticate(email, password, "seller") : { success: false, message: "Store initializing..." };

              onLogin(res.session);
            } else {

            }

          }, 350);
        };

            "div",

                    borderRadius: "14px",

                    marginBottom: "1.25rem",

                },
                React.createElement(

                React.createElement(
                  "button",

                    justifyContent: "space-between",

                React.createElement(

                    href: "index.html",

                      color: "#60A5FA",
                      fontSize: "0.8rem",
                      textDecoration: "none",
                      fontWeight: 600,
                    },

                  "a",

                    href: "manager.html",
                    style: {
                      color: "var(--text3)",
                      fontSize: "0.8rem",
                      textDecoration: "none",
                      fontWeight: 500,
                    },
                  },
                  "Manager Portal →",
                ),
              ),
            ),
          ),
        );
      }

      // ─── DASHBOARD CHARTS ────────────────────────────────────────
      function DashboardCharts({ sales }) {
        const doughnutRef = useRef(null);
        const lineRef = useRef(null);
        const doughnutInstance = useRef(null);
        const lineInstance = useRef(null);

        useEffect(() => {
          if (!doughnutRef.current || !lineRef.current) return;
          if (doughnutInstance.current) doughnutInstance.current.destroy();
          if (lineInstance.current) lineInstance.current.destroy();

          const catMap = {};
          (sales || []).forEach((s) =>
            (s.items || []).forEach((i) => {
              catMap[i.name] = (catMap[i.name] || 0) + (i.qty || 1);
            }),
          );
          const labels = Object.keys(catMap).slice(0, 5);
          const data = Object.values(catMap).slice(0, 5);
          if (labels.length === 0) {
            labels.push("No Sales Yet");
            data.push(1);
          }

          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          const textColor = isDark ? "#94a3b8" : "#475569";

          doughnutInstance.current = new Chart(doughnutRef.current, {
            type: "doughnut",
            data: {
              labels: labels,
              datasets: [
                {
                  data: data,
                  backgroundColor: ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6"],
                  borderWidth: 0,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: textColor, boxWidth: 12, padding: 12 },
                },
              },
              cutout: "65%",
            },
          });

          const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
          const weeklyData = [0, 0, 0, 0, 0, 0, 0];
          (sales || []).forEach((s) => {
            const dayIndex = new Date(s.timestamp).getDay();
            if (dayIndex >= 0 && dayIndex <= 6) {
              const mapped = dayIndex === 0 ? 6 : dayIndex - 1;
              weeklyData[mapped] += Number(s.total || 0);
            }
          });

          lineInstance.current = new Chart(lineRef.current, {
            type: "line",
            data: {
              labels: days,
              datasets: [
                {
                  label: "Revenue (SLE)",
                  data: weeklyData,
                  borderColor: "#10B981",
                  backgroundColor: "rgba(16, 185, 129, 0.12)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 4,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: isDark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)" },
                  ticks: { color: textColor },
                },
                x: { grid: { display: false }, ticks: { color: textColor } },
              },
            },
          });

          return () => {
            if (doughnutInstance.current) doughnutInstance.current.destroy();
            if (lineInstance.current) lineInstance.current.destroy();
          };
        }, [sales]);

        return React.createElement(
          "div",
          {
            style: {
              display: "grid",
              gridTemplateColumns: "1fr 2fr",
              gap: "1.5rem",
            },
          },
          React.createElement(
            "div",
            { className: "wd-card", style: { padding: "1.5rem" } },
            React.createElement(
              "h3",
              { style: { fontWeight: 700, marginBottom: "1rem" } },
              "Top Selling Items",
            ),
            React.createElement(
              "div",
              { style: { height: "220px", width: "100%", position: "relative" } },
              React.createElement("canvas", { ref: doughnutRef }),
            ),
          ),
          React.createElement(
            "div",
            { className: "wd-card", style: { padding: "1.5rem" } },
            React.createElement(
              "h3",
              { style: { fontWeight: 700, marginBottom: "1rem" } },
              "Weekly Revenue Trends (SLE)",
            ),
            React.createElement(
              "div",
              { style: { height: "220px", width: "100%" } },
              React.createElement("canvas", { ref: lineRef }),
            ),
          ),
        );
      }

      // ─── RECEIPT MODAL ────────────────────────────────────────────
      function ReceiptModal({ sale, onClose, onPrint, onWhatsApp }) {
        if (!sale) return null;
        return React.createElement(

        const [section, setSection] = useState("pos");

        const [paymentMethod, setPaymentMethod] = useState("Cash");
        const [toasts, setToasts] = useState([]);
        const [receiptSale, setReceiptSale] = useState(null);

        const addToast = (title, message, type = "success") => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, title, message, type }]);
          setTimeout(
            () => setToasts((prev) => prev.filter((t) => t.id !== id)),
            4000,
          );
        };

        // Real-Time Sync Subscription (BroadcastChannel + Local Storage + Supabase)
        useEffect(() => {
          if (!window.WD_STORE) return;

          const unsubscribe = window.WD_STORE.subscribeBroadcast((msg) => {
            if (msg.type === "SYNC_INVENTORY" || msg.type === "DATA_UPDATED") {
              if (Array.isArray(msg.products)) {
                setProducts(msg.products);
                addToast("Catalog Updated", "Manager modified products or stock.", "info");
              }
              if (Array.isArray(msg.sales)) {
                setSales(msg.sales);
              }
            } else if (msg.type === "SALE_LOGGED" && msg.sale) {
              setSales((prev) => [msg.sale, ...prev.filter((s) => s.id !== msg.sale.id)]);
              if (Array.isArray(msg.products)) {
                setProducts(msg.products);
              }
            }
          });

          const unsubSupabase = window.WD_STORE.setupSupabaseRealtime(
            (newSaleRow) => {
              window.WD_STORE.syncFromSupabase().then((res) => {
                if (res) {
                  setProducts(res.products);
                  setSales(res.sales);
                }
              });
            },
            (invChange) => {
              window.WD_STORE.syncFromSupabase().then((res) => {
                if (res) {
                  setProducts(res.products);
                  setSales(res.sales);
                }
              });
            }
          );

          window.WD_STORE.syncFromSupabase().then((res) => {
            if (res) {
              setProducts(res.products);
              setSales(res.sales);
            }
          });

          return () => {
            if (unsubscribe) unsubscribe();
            if (unsubSupabase) unsubSupabase();
          };
        }, []);

        const categories = useMemo(() => {
          const cats = ["All", ...new Set(products.map((p) => p.category || "Other"))];
          return cats;
        }, [products]);

        const filteredProducts = useMemo(() => {
          return products.filter((p) => {
            const matchesSearch =
              p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
              (p.sku && p.sku.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesCat = categoryFilter === "All" || p.category === categoryFilter;
            return matchesSearch && matchesCat;
          });
        }, [products, searchTerm, categoryFilter]);

        const addToCart = (product) => {
          if (product.stock <= 0) {
            addToast("Out of Stock", product.name + " is currently out of stock.", "warning");
            return;
          }
          const existing = cart.find((i) => i.id === product.id);
          if (existing) {
            if (existing.qty >= product.stock) {
              addToast("Stock Limit", "Only " + product.stock + " units available in stock.", "warning");
              return;
            }
            setCart(
              cart.map((i) =>
                i.id === product.id ? { ...i, qty: i.qty + 1 } : i,
              ),
            );
          } else {
            setCart([...cart, { ...product, qty: 1 }]);
          }
          addToast("Added to Cart", (product.emoji || "📦") + " " + product.name);
        };

        const updateCartQty = (productId, delta) => {
          const existing = cart.find((i) => i.id === productId);
          if (!existing) return;
          const prod = products.find((p) => p.id === productId);
          const maxStock = prod ? prod.stock : 999;

          if (delta > 0 && existing.qty >= maxStock) {
            addToast("Stock Limit", "Only " + maxStock + " units available.", "warning");
            return;
          }

          if (existing.qty + delta <= 0) {
            setCart(cart.filter((i) => i.id !== productId));
          } else {
            setCart(
              cart.map((i) =>
                i.id === productId ? { ...i, qty: i.qty + delta } : i,
              ),
            );
          }
        };

        const removeFromCart = (productId) => {
          setCart(cart.filter((i) => i.id !== productId));
        };

        const handleCheckout = () => {
          if (cart.length === 0) {
            addToast("Empty Cart", "Please add items to cart first.", "warning");
            return;
          }
          if (!customerName.trim()) {
            addToast("Customer Required", "Please enter the customer name.", "warning");
            return;
          }

          const saleItems = cart.map((item) => ({
            productId: item.id,
            name: item.name,
            qty: item.qty,
            unitPrice: Number(item.price),
            total: Number(item.price) * item.qty,
          }));
          const total = cart.reduce((sum, i) => sum + Number(i.price) * i.qty, 0);

          const newSale = {
            id: "s" + Date.now(),
            receiptNo: "WD-" + String(sales.length + 1).padStart(4, "0"),
            sellerId: session.userId,
            sellerName: session.userName,
            sellerEmail: session.userEmail || "",
            items: saleItems,
            total: total,
            payment: paymentMethod,
            customer: customerName.trim(),
            customerPhone: customerPhone.trim() || "N/A",
            timestamp: new Date().toISOString(),
          };

          const updatedProducts = products.map((p) => {
            const sold = cart.find((i) => i.id === p.id);
            return sold
              ? { ...p, stock: Math.max(0, p.stock - sold.qty) }
              : p;
          });

          const updatedSales = [newSale, ...sales];

          setProducts(updatedProducts);
          setSales(updatedSales);
          setCart([]);
          setCustomerName("");
          setCustomerPhone("");
          setReceiptSale(newSale);
          addToast("Sale Completed!", "Receipt " + newSale.receiptNo + " generated.");

          if (window.WD_STORE) {
            window.WD_STORE.saveData({ products: updatedProducts, sales: updatedSales }, true);
            window.WD_STORE.broadcastMessage({
              type: "SALE_LOGGED",
              sale: newSale,
              products: updatedProducts,
            });

            window.WD_STORE.pushSaleToSupabase(newSale);
            saleItems.forEach((item) => {
              const prod = updatedProducts.find((p) => p.id === item.productId);
              if (prod) window.WD_STORE.pushProductToSupabase(prod);
            });
          }
        };

      // ─── ROOT APP COMPONENT ──────────────────────────────────────
      function App() {
        const [session, setSession] = useState(() => {
          return window.WD_STORE ? window.WD_STORE.getSellerSession() : null;
        });
        const [theme, setTheme] = useState(
          () => localStorage.getItem("wd_theme") || "dark",
        );

        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("wd_theme", theme);
        }, [theme]);

        if (!session) {
          return React.createElement(LoginPage, { onLogin: setSession });
        }

        return React.createElement(POSDashboard, {
          session: session,
          onLogout: () => {
            if (window.WD_STORE) window.WD_STORE.clearSellerSession();
            setSession(null);
          },
          theme: theme,
          onThemeChange: () => setTheme(theme === "dark" ? "light" : "dark"),
        });
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
