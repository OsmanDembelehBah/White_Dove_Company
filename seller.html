    <style>
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        transition:
          background 0.25s,
          color 0.25s;
      }
      .font-heading {
        font-family: "Outfit", sans-serif;
      }

      :root[data-theme="light"] {
        --bg: #f1f5f9;
        --bg2: #ffffff;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text2: #475569;
        --text3: #94a3b8;
        --blue-bg: #eff6ff;
        --sidebar-bg: #ffffff;
        --notif-bg: #f1f5f9;
      }
      :root[data-theme="dark"] {
        --bg: #050d1a;
        --bg2: #0d1b30;
        --card: #0d1b30;
        --border: #1a3050;
        --text: #f1f5f9;
        --text2: #94a3b8;
        --text3: #475569;
        --blue-bg: rgba(10, 61, 145, 0.15);
        --sidebar-bg: #070f1d;
        --notif-bg: #0d1b30;
      }

      .app-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .app-bg-dark {
        background:
          radial-gradient(
            ellipse 80% 60% at 50% -10%,
            rgba(10, 61, 145, 0.2) 0%,
            transparent 60%
          ),
          #050d1a;
      }
      .app-bg-light {
        background:
          radial-gradient(
            ellipse 80% 60% at 50% -10%,
            rgba(10, 61, 145, 0.06) 0%,
            transparent 60%
          ),
          #f1f5f9;
      }

      .sidebar {
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        transition: width 0.2s;
        width: 240px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        position: sticky;
        top: 0;
      }
      @media (max-width: 768px) {
        .sidebar {
          width: 64px !important;
        }
        .sidebar .nav-text,
        .sidebar .brand-text,
        .sidebar .seller-name {
          display: none;
        }
        .sidebar .brand-icon {
          margin: 0 auto;
        }
        .sidebar .nav-item {
          justify-content: center;
          padding: 0.6rem 0;
        }
        .pos-grid {
          grid-template-columns: 1fr !important;
        }
        .product-grid {
          grid-template-columns: repeat(
            auto-fill,
            minmax(130px, 1fr)
          ) !important;
        }
        .cart-side {
          margin-top: 1rem;
        }
        .stats-grid {
          grid-template-columns: 1fr 1fr !important;
        }
      }
      @media (max-width: 480px) {
        .stats-grid {
          grid-template-columns: 1fr !important;
        }
        .sidebar {
          width: 56px !important;
        }
        .sidebar .nav-item {
          padding: 0.4rem 0;
        }
      }

      .wd-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        transition:
          background 0.25s,
          border 0.25s;
      }

      .wd-input {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 0.625rem 0.875rem;
        font-size: 0.875rem;
        width: 100%;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        font-family: "Inter", sans-serif;
      }
      .wd-input:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }
      .wd-input::placeholder {
        color: var(--text3);
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 10px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        color: var(--text2);
        background: transparent;
        border: none;
        width: 100%;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--bg2);
        color: var(--text);
        transform: translateX(4px);
      }
      .nav-item.active {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        font-weight: 600;
      }

      .badge-in-stock {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      .badge-low-stock {
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.2);
      }
      .badge-out-stock {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      .wd-table thead th {
        background: var(--bg);
        color: var(--text3);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      .wd-table tbody td {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .wd-table tbody tr:hover {
        background: var(--bg);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        animation: fadeIn 0.2s ease-out;
      }
      .modal-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        width: 100%;
        max-width: 580px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.3s ease-out;
        max-height: 90vh;
        overflow-y: auto;
      }

      .kpi-card {
        transition:

          box-shadow 0.2s;
        cursor: default;
      }
      .kpi-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .whatsapp-btn {
        background: #25d366;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s;
        font-weight: 600;
        font-size: 0.875rem;
      }
      .whatsapp-btn:hover {
        background: #1da851;
        transform: scale(1.02);
      }

      .receipt-print {
        background: white;
        color: #0f172a;
        padding: 2rem;
        border-radius: 12px;
        max-width: 400px;
        margin: 0 auto;
      }
      .receipt-print .company-name {
        font-size: 1.4rem;
        font-weight: 900;
        color: #0a3d91;
        font-family: "Outfit", sans-serif;
        text-align: center;
      }
      .receipt-print .company-sub {
        font-size: 0.7rem;
        color: #64748b;
        text-align: center;
      }
      .receipt-print .divider {
        border-top: 2px dashed #e2e8f0;
        margin: 1rem 0;
      }
      .receipt-print .receipt-item {
        display: flex;
        justify-content: space-between;
        padding: 0.25rem 0;
        font-size: 0.8rem;
        border-bottom: 1px solid #f1f5f9;
      }
      .receipt-print .receipt-total {
        display: flex;
        justify-content: space-between;
        padding: 0.75rem 0;
        border-top: 2px solid #0a3d91;
        font-size: 1rem;
        font-weight: 800;
        color: #0a3d91;
      }
      .receipt-print .receipt-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px dashed #e2e8f0;
        font-size: 0.7rem;
        color: #94a3b8;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        position: relative;
      }
      .pulse-dot::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.3);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 380px;
      }
      .toast {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.25rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
    </style>
  </head>

          sessionStorage.removeItem("sellerName");
          window.location.href = "index.html";
        }, []);

        const session = {
          userId: "seller",
          userName,
          userTitle: "Sales Representative",
          avatar: userName.charAt(0).toUpperCase(),
          role: "seller",
        };

        return (
          <Dashboard
            session={session}
            onLogout={handleLogout}
            theme={theme}
            onThemeChange={applyTheme}
            addToast={addToast}
            dismissToast={dismissToast}
            toasts={toasts}
          />
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
