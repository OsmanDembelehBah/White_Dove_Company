      :root[data-theme="light"] {

        background: var(--bg);
        color: var(--text);

      .sidebar {
        background: var(--sidebar-bg);

        height: 100vh;
        position: sticky;
        top: 0;
        display: flex;

        }
        .sidebar .nav-item {
          justify-content: center;
          padding: 0.6rem 0;
        }
      }

      .wd-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        transition: all 0.3s ease;
      }
      .wd-card:hover {
        border-color: rgba(16, 185, 129, 0.2);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .wd-input {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 0.625rem 0.875rem;
        font-size: 0.875rem;
        width: 100%;
        outline: none;
        transition: all 0.2s;
      }
      .wd-input:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 10px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        color: var(--text2);
        background: transparent;
        border: none;
        width: 100%;
      }
      .nav-item:hover {
        background: var(--bg2);
        color: var(--text);
        transform: translateX(4px);
      }
      .nav-item.active {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        font-weight: 600;
      }

      /* Animated Backgrounds for KPI Cards */
      .kpi-card-blue {
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        color: white;
      }
      .kpi-card-green {
        background: linear-gradient(135deg, #064e3b, #10b981);
        color: white;
      }
      .kpi-card-orange {
        background: linear-gradient(135deg, #78350f, #f59e0b);
        color: white;
      }
      .kpi-card-purple {
        background: linear-gradient(135deg, #4c1d95, #8b5cf6);
        color: white;
      }
      .kpi-card-red {
        background: linear-gradient(135deg, #7f1d1d, #ef4444);
        color: white;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .toast-container {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 380px;
      }
      .toast {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.25rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      @media (max-width: 768px) {
        .modal-box {
          max-width: 95%;
          max-height: 95vh;
        }
      }

      // ─── TOAST SYSTEM ─────────────────────────────────────────────
      function ToastContainer({ toasts, removeToast }) {
        return React.createElement(
          "div",
          { className: "toast-container" },
          toasts.map((t) =>
            React.createElement(
              "div",
              {
                key: t.id,
                className: "toast",
                style: {
                  borderLeft: `4px solid ${t.type === "success" ? "#10B981" : "#F59E0B"}`,

              },
              React.createElement(
                "span",
                { style: { fontSize: "1.2rem" } },
                t.type === "success" ? "✅" : "⚠️",
              ),

      // ─── LOGIN PAGE ──────────────────────────────────────────────
      function LoginPage({ onLogin }) {
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        const handleSubmit = (e) => {
          e.preventDefault();
          setLoading(true);
          setError("");
          setTimeout(() => {
            const user = SELLER_USERS.find(
              (u) => u.email === email && u.password === password,
            );
            if (user) {
              const session = {
                userId: user.id,
                userName: user.name,
                avatar: user.avatar,
                role: "seller",
                expiresAt: Date.now() + 8 * 60 * 60 * 1000,
              };
              sessionStorage.setItem(
                "wd_seller_session",
                JSON.stringify(session),
              );
              onLogin(session);
            } else {
              setError("Invalid email or password.");
            }
            setLoading(false);
          }, 600);
        };
        return React.createElement(
          "div",
          {
            style: {
              minHeight: "100vh",
              background: "var(--bg)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: "1.5rem",
            },
          },

            "div",

                style: {

                    },
                  },
                  "WHITE DOVE",
                ),

                  "div",
                  {
                    style: {
                      fontSize: "0.7rem",
                      fontWeight: 600,
                      color: "#60A5FA",
                      letterSpacing: "0.15em",
                      textTransform: "uppercase",
                    },
                  },
                  "SELLER POS",
                ),
              ),
              React.createElement(
                "form",
                {
                  onSubmit: handleSubmit,
                  style: {
                    display: "flex",
                    flexDirection: "column",
                    gap: "1rem",
                  },
                },
                React.createElement("input", {
                  type: "email",
                  className: "wd-input",
                  value: email,
                  onChange: (e) => setEmail(e.target.value),
                  placeholder: "Email Address",
                  required: true,
                }),
                React.createElement("input", {
                  type: "password",
                  className: "wd-input",
                  value: password,
                  onChange: (e) => setPassword(e.target.value),
                  placeholder: "Password",
                  required: true,
                }),
                error &&
                  React.createElement(
                    "div",
                    {
                      style: {
                        color: "#EF4444",
                        fontSize: "0.8rem",
                        textAlign: "center",
                      },
                    },
                    error,
                  ),
                React.createElement(
                  "button",
                  {
                    type: "submit",
                    disabled: loading,
                    style: {
                      background: loading
                        ? "#1A3050"
                        : "linear-gradient(135deg, #0A3D91, #1255C4)",
                      color: "white",
                      border: "none",
                      borderRadius: "12px",
                      padding: "0.875rem",
                      fontSize: "0.95rem",
                      fontWeight: 700,
                      cursor: loading ? "not-allowed" : "pointer",
                    },
                  },
                  loading ? "Authenticating..." : "Sign In",
                ),
              ),
            ),
          ),

      // ─── DASHBOARD CHARTS ────────────────────────────────────────
      function DashboardCharts({ sales }) {
        const doughnutRef = useRef(null);
        const lineRef = useRef(null);
        const doughnutInstance = useRef(null);
        const lineInstance = useRef(null);

        useEffect(() => {
          if (!doughnutRef.current || !lineRef.current) return;
          if (doughnutInstance.current) doughnutInstance.current.destroy();
          if (lineInstance.current) lineInstance.current.destroy();

          // Data Calculation
          const catMap = {};
          sales.forEach((s) =>
            s.items.forEach((i) => {
              catMap[i.name] = (catMap[i.name] || 0) + i.qty;
            }),
          );
          const labels = Object.keys(catMap).slice(0, 5);
          const data = Object.values(catMap).slice(0, 5);
          if (labels.length === 0) {
            labels.push("No Sales");
            data.push(1);
          }

          const isDark =
            document.documentElement.getAttribute("data-theme") === "dark";
          const textColor = isDark ? "#94a3b8" : "#475569";

          // Doughnut Chart
          doughnutInstance.current = new Chart(doughnutRef.current, {
            type: "doughnut",
            data: {
              labels: labels,
              datasets: [
                {
                  data: data,
                  backgroundColor: [
                    "#3B82F6",
                    "#10B981",
                    "#F59E0B",
                    "#EF4444",
                    "#8B5CF6",
                  ],
                  borderWidth: 0,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: textColor, boxWidth: 12, padding: 12 },
                },
              },
              cutout: "65%",
            },
          });

          // Line Chart (Weekly)
          const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
          const weeklyData = days.map(() => 0);
          sales.forEach((s) => {
            const dayIndex = new Date(s.timestamp).getDay();
            if (dayIndex > 0 && dayIndex <= 7)
              weeklyData[dayIndex === 7 ? 6 : dayIndex - 1] += s.total;
          });

          lineInstance.current = new Chart(lineRef.current, {
            type: "line",
            data: {
              labels: days,
              datasets: [
                {
                  label: "Revenue",
                  data: weeklyData,
                  borderColor: "#3B82F6",
                  backgroundColor: "rgba(59, 130, 246, 0.1)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 4,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: {
                    color: isDark
                      ? "rgba(255,255,255,0.05)"
                      : "rgba(0,0,0,0.05)",
                  },
                  ticks: { color: textColor },
                },
                x: { grid: { display: false }, ticks: { color: textColor } },
              },
            },
          });
          return () => {
            if (doughnutInstance.current) doughnutInstance.current.destroy();
            if (lineInstance.current) lineInstance.current.destroy();
          };
        }, [sales]);

        return React.createElement(
          "div",
          {
            style: {
              display: "grid",
              gridTemplateColumns: "1fr 2fr",
              gap: "1.5rem",
            },
          },
          React.createElement(
            "div",
            { className: "wd-card", style: { padding: "1.5rem" } },
            React.createElement(
              "h3",
              { style: { fontWeight: 700, marginBottom: "1rem" } },

            React.createElement(
              "div",
              {

            ),
          ),
          React.createElement(
            "div",
            { className: "wd-card", style: { padding: "1.5rem" } },
            React.createElement(

              { style: { fontWeight: 700, marginBottom: "1rem" } },

      // ─── MAIN POS DASHBOARD ──────────────────────────────────────
      function POSDashboard({ session, onLogout, theme, onThemeChange }) {
        const [cart, setCart] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [sales, setSales] = useState(INITIAL_SALES);
        const [products, setProducts] = useState(PRODUCTS);
        const [section, setSection] = useState("pos");
        const [customerName, setCustomerName] = useState("");
        const [customerPhone, setCustomerPhone] = useState("");
        const [paymentMethod, setPaymentMethod] = useState("Cash");
        const [toasts, setToasts] = useState([]);
        const [receiptSale, setReceiptSale] = useState(null);

        const addToast = (title, message, type = "success") => {
          const id = Date.now();
          setToasts([...toasts, { id, title, message, type }]);
          setTimeout(
            () => setToasts((prev) => prev.filter((t) => t.id !== id)),
            4000,
          );
        };
        const filteredProducts = products.filter((p) =>
          p.name.toLowerCase().includes(searchTerm.toLowerCase()),
        );

        const addToCart = (product) => {
          const existing = cart.find((i) => i.id === product.id);
          if (existing) {
            if (existing.qty >= product.stock) {
              addToast("Stock Limit!", "Cannot add more", "warning");
              return;
            }
            setCart(
              cart.map((i) =>
                i.id === product.id ? { ...i, qty: i.qty + 1 } : i,
              ),
            );
          } else {
            setCart([...cart, { ...product, qty: 1 }]);
          }
          addToast("Added", `${product.emoji} ${product.name}`);
        };

        const handleCheckout = () => {
          if (cart.length === 0 || !customerName.trim()) {
            addToast("Error", "Fill in customer name and cart", "warning");
            return;
          }
          const saleItems = cart.map((item) => ({
            productId: item.id,
            name: item.name,
            qty: item.qty,
            unitPrice: item.price,
            total: item.price * item.qty,
          }));
          const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
          const newSale = {
            id: `s${Date.now()}`,
            receiptNo: `WD-${String(sales.length + 1).padStart(3, "0")}`,
            sellerName: session.userName,
            items: saleItems,
            total,
            payment: paymentMethod,
            customer: customerName.trim(),
            customerPhone: customerPhone.trim() || "N/A",
            timestamp: new Date().toISOString(),
          };
          setSales([newSale, ...sales]);
          setProducts(
            products.map((p) => {
              const sold = cart.find((i) => i.id === p.id);
              return sold
                ? { ...p, stock: Math.max(0, p.stock - sold.qty) }
                : p;
            }),
          );
          setCart([]);
          setCustomerName("");
          setCustomerPhone("");
          setReceiptSale(newSale);
          addToast("Sale Complete!", `Receipt ${newSale.receiptNo} generated.`);
        };

        const generateReceiptPDF = (sale) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: "mm", format: "a4" });

          let y = 20;

          doc.setFontSize(9);
          doc.setTextColor("#475569");

          y += 5;
          doc.text("Building Your Vision, Powering Your Future.", pw / 2, y, {
            align: "center",
          });
          y += 6;
          doc.line(20, y, pw - 20, y);
          y += 6;
          doc.setFontSize(9);
          doc.setTextColor("#0F172A");
          doc.setFont("helvetica", "bold");
          doc.text(`Receipt: ${sale.receiptNo}`, 20, y);
          doc.text(
            `Date: ${new Date(sale.timestamp).toLocaleDateString()}`,

            y,
          );
          y += 5;
          doc.text(`Customer: ${sale.customer}`, 20, y);
          y += 5;
          doc.line(20, y, pw - 20, y);
          y += 5;
          doc.setFont("helvetica", "bold");
          doc.setTextColor("#64748B");
          doc.text("Item", 20, y);
          doc.text("Qty", 130, y);
          doc.text("Total", 180, y);
          y += 4;
          doc.line(20, y, pw - 20, y);
          y += 5;
          doc.setFont("helvetica", "normal");
          doc.setTextColor("#0F172A");
          sale.items.forEach((item) => {
            doc.text(
              item.name.length > 20
                ? item.name.substring(0, 18) + "…"

            y += 5;
          });
          y += 4;
          doc.line(20, y, pw - 20, y);
          y += 6;
          doc.setFont("helvetica", "bold");

          doc.setFontSize(13);
          doc.text("TOTAL", 20, y);
          doc.text(fmt(sale.total), pw - 20, y, { align: "right" });

                          padding: "0.5rem 0",
                        },
                      },
                      cart.length === 0
                        ? React.createElement(
                            "div",
                            {
                              style: {
                                textAlign: "center",
                                padding: "1rem",
                                color: "var(--text3)",
                              },
                            },
                            "Cart empty",
                          )
                        : cart.map((item) =>
                            React.createElement(
                              "div",
                              {
                                key: item.id,
                                style: {
                                  display: "flex",
                                  alignItems: "center",
                                  justifyContent: "space-between",
                                  padding: "0.3rem 0",
                                  borderBottom: "1px solid var(--border)",
                                },
                              },
                              React.createElement(
                                "div",
                                null,
                                React.createElement(
                                  "div",
                                  {
                                    style: {
                                      fontWeight: 600,
                                      fontSize: "0.8rem",
                                    },
                                  },
                                  item.name,
                                ),
                                React.createElement(
                                  "div",
                                  {
                                    style: {
                                      fontSize: "0.7rem",
                                      color: "var(--text3)",
                                    },
                                  },
                                  fmt(item.price),
                                ),
                              ),
                              React.createElement(
                                "div",
                                {
                                  style: {
                                    display: "flex",
                                    alignItems: "center",
                                    gap: "0.3rem",
                                  },
                                },
                                React.createElement(
                                  "button",
                                  {
                                    onClick: () =>
                                      setCart(
                                        cart
                                          .map((i) =>
                                            i.id === item.id
                                              ? {
                                                  ...i,
                                                  qty: Math.max(1, i.qty - 1),
                                                }
                                              : i,
                                          )
                                          .filter((i) => i.qty > 0),
                                      ),
                                    style: {
                                      width: "20px",
                                      height: "20px",
                                      borderRadius: "4px",
                                      border: "1px solid var(--border)",
                                      background: "transparent",
                                      cursor: "pointer",
                                    },
                                  },
                                  "-",
                                ),
                                React.createElement(
                                  "span",
                                  {
                                    style: {
                                      minWidth: "20px",
                                      textAlign: "center",
                                    },
                                  },
                                  item.qty,
                                ),
                                React.createElement(
                                  "button",
                                  {
                                    onClick: () =>
                                      setCart(
                                        cart.map((i) =>
                                          i.id === item.id
                                            ? { ...i, qty: i.qty + 1 }
                                            : i,
                                        ),
                                      ),
                                    style: {
                                      width: "20px",
                                      height: "20px",
                                      borderRadius: "4px",
                                      border: "1px solid var(--border)",
                                      background: "transparent",
                                      cursor: "pointer",
                                    },
                                  },
                                  "+",
                                ),
                              ),
                              React.createElement(
                                "span",
                                {
                                  style: { fontWeight: 700, color: "#10B981" },
                                },
                                fmt(item.price * item.qty),
                              ),
                            ),
                          ),
                    ),
                    React.createElement(
                      "div",
                      {
                        style: {
                          display: "flex",
                          justifyContent: "space-between",
                          fontSize: "1.1rem",
                          fontWeight: 800,
                        },
                      },
                      React.createElement("span", null, "Total"),
                      React.createElement(
                        "span",
                        { style: { color: "#10B981" } },
                        fmt(cart.reduce((s, i) => s + i.price * i.qty, 0)),
                      ),
                    ),
                    React.createElement(
                      "button",
                      {
                        onClick: handleCheckout,
                        disabled: cart.length === 0,
                        style: {
                          width: "100%",
                          padding: "0.7rem",
                          borderRadius: "12px",
                          border: "none",
                          background: cart.length > 0 ? "#0A3D91" : "var(--bg)",
                          color: cart.length > 0 ? "white" : "var(--text3)",
                          fontWeight: 700,
                          cursor: cart.length > 0 ? "pointer" : "not-allowed",
                        },
                      },
                      "✅ Complete Sale",
                    ),
                  ),
                ),
              // DASHBOARD VIEW
              section === "dashboard" &&
                React.createElement(
                  "div",
                  {
                    style: {
                      display: "flex",
                      flexDirection: "column",
                      gap: "1.5rem",
                    },
                  },
                  React.createElement(
                    "div",
                    {
                      style: {
                        display: "grid",
                        gridTemplateColumns:
                          "repeat(auto-fit, minmax(220px, 1fr))",
                        gap: "1rem",
                      },
                    },
                    React.createElement(
                      "div",
                      {
                        className: "wd-card kpi-card-blue",
                        style: { padding: "1.25rem" },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            display: "flex",
                            justifyContent: "space-between",
                          },
                        },
                        React.createElement(
                          "span",
                          { style: { fontSize: "0.8rem", opacity: 0.8 } },
                          "Total Revenue",
                        ),
                        React.createElement(
                          "span",
                          { style: { fontSize: "1.2rem" } },
                          "💰",
                        ),
                      ),
                      React.createElement(
                        "div",
                        {
                          className: "font-heading",
                          style: { fontSize: "1.5rem", fontWeight: 800 },
                        },
                        fmt(totalRevenue),
                      ),
                    ),
                    React.createElement(
                      "div",
                      {
                        className: "wd-card kpi-card-green",
                        style: { padding: "1.25rem" },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            display: "flex",
                            justifyContent: "space-between",
                          },
                        },
                        React.createElement(
                          "span",
                          { style: { fontSize: "0.8rem", opacity: 0.8 } },
                          "Total Sales",
                        ),
                        React.createElement(
                          "span",
                          { style: { fontSize: "1.2rem" } },
                          "📦",
                        ),
                      ),
                      React.createElement(
                        "div",
                        {
                          className: "font-heading",
                          style: { fontSize: "1.5rem", fontWeight: 800 },
                        },
                        sales.length,
                      ),
                    ),
                    React.createElement(
                      "div",
                      {
                        className: "wd-card kpi-card-orange",
                        style: { padding: "1.25rem" },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            display: "flex",
                            justifyContent: "space-between",
                          },
                        },
                        React.createElement(
                          "span",
                          { style: { fontSize: "0.8rem", opacity: 0.8 } },
                          "Items Sold",
                        ),
                        React.createElement(
                          "span",
                          { style: { fontSize: "1.2rem" } },
                          "🔢",
                        ),
                      ),
                      React.createElement(
                        "div",
                        {
                          className: "font-heading",
                          style: { fontSize: "1.5rem", fontWeight: 800 },
                        },
                        totalItemsSold,
                      ),
                    ),
                    React.createElement(
                      "div",
                      {
                        className: "wd-card kpi-card-purple",
                        style: { padding: "1.25rem" },
                      },
                      React.createElement(
                        "div",
                        {
                          style: {
                            display: "flex",
                            justifyContent: "space-between",
                          },
                        },
                        React.createElement(
                          "span",
                          { style: { fontSize: "0.8rem", opacity: 0.8 } },
                          "Avg. Order",
                        ),
                        React.createElement(
                          "span",
                          { style: { fontSize: "1.2rem" } },
                          "📊",
                        ),
                      ),
                      React.createElement(
                        "div",
                        {
                          className: "font-heading",
                          style: { fontSize: "1.5rem", fontWeight: 800 },
                        },
                        fmt(avgOrderValue),
                      ),
                    ),
                  ),
                  React.createElement(DashboardCharts, { sales: sales }),
                ),
              // HISTORY VIEW
              section === "history" &&
                React.createElement(
                  "div",
                  { className: "wd-card", style: { overflow: "hidden" } },
                  React.createElement(
                    "div",
                    {
                      style: {
                        padding: "1rem 1.5rem",
                        borderBottom: "1px solid var(--border)",
                      },
                    },
                    React.createElement(
                      "span",
                      { className: "font-heading", style: { fontWeight: 700 } },
                      "📄 Transaction History",
                    ),
                  ),
                  React.createElement(
                    "div",
                    { style: { maxHeight: "500px", overflowY: "auto" } },
                    sales.length === 0
                      ? React.createElement(
                          "div",
                          {
                            style: {
                              textAlign: "center",
                              padding: "2rem",
                              color: "var(--text3)",
                            },
                          },
                          "No transactions yet.",
                        )
                      : React.createElement(
                          "table",
                          {
                            style: {
                              width: "100%",
                              borderCollapse: "collapse",
                            },
                          },
                          React.createElement(
                            "thead",
                            null,
                            React.createElement(
                              "tr",
                              null,
                              [
                                "Receipt",
                                "Customer",
                                "Items",
                                "Total",
                                "Date",
                                "Actions",
                              ].map((h) =>
                                React.createElement(
                                  "th",
                                  {
                                    key: h,
                                    style: {
                                      textAlign: "left",
                                      padding: "0.75rem 1rem",
                                      borderBottom: "1px solid var(--border)",
                                      color: "var(--text3)",
                                      fontSize: "0.75rem",
                                      fontWeight: 600,
                                    },
                                  },
                                  h,
                                ),
                              ),
                            ),
                          ),
                          React.createElement(
                            "tbody",
                            null,
                            sales.map((s) =>
                              React.createElement(
                                "tr",
                                {
                                  key: s.id,
                                  style: {
                                    borderBottom: "1px solid var(--border)",
                                  },
                                },
                                React.createElement(
                                  "td",
                                  {
                                    style: {
                                      padding: "0.75rem 1rem",
                                      fontWeight: 600,
                                      color: "#60A5FA",
                                    },
                                  },
                                  s.receiptNo,
                                ),
                                React.createElement(
                                  "td",
                                  { style: { padding: "0.75rem 1rem" } },
                                  s.customer,
                                ),
                                React.createElement(
                                  "td",
                                  {
                                    style: {
                                      padding: "0.75rem 1rem",
                                      fontSize: "0.8rem",
                                    },
                                  },
                                  s.items.reduce((a, i) => a + i.qty, 0) +
                                    " items",
                                ),
                                React.createElement(
                                  "td",
                                  {
                                    style: {
                                      padding: "0.75rem 1rem",
                                      fontWeight: 700,
                                      color: "#10B981",
                                    },
                                  },
                                  fmt(s.total),
                                ),
                                React.createElement(
                                  "td",
                                  {
                                    style: {
                                      padding: "0.75rem 1rem",
                                      fontSize: "0.8rem",
                                      color: "var(--text3)",
                                    },
                                  },
                                  new Date(s.timestamp).toLocaleDateString(),
                                ),
                                React.createElement(
                                  "td",
                                  { style: { padding: "0.75rem 1rem" } },
                                  React.createElement(
                                    "div",
                                    {
                                      style: { display: "flex", gap: "0.3rem" },
                                    },
                                    React.createElement(
                                      "button",
                                      {
                                        onClick: () => generateReceiptPDF(s),
                                        style: {
                                          padding: "0.2rem 0.5rem",
                                          borderRadius: "4px",
                                          background: "#0A3D91",
                                          color: "white",
                                          border: "none",
                                          cursor: "pointer",
                                        },
                                      },
                                      "PDF",
                                    ),
                                    React.createElement(
                                      "button",
                                      {
                                        onClick: () => sendWhatsAppReceipt(s),
                                        style: {
                                          padding: "0.2rem 0.5rem",
                                          borderRadius: "4px",
                                          background: "#25D366",
                                          color: "white",
                                          border: "none",
                                          cursor: "pointer",
                                        },
                                      },
                                      "WA",
                                    ),
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ),
                  ),
                ),
            ),
          ),
          React.createElement(ToastContainer, {
            toasts: toasts,
            removeToast: (id) => setToasts(toasts.filter((t) => t.id !== id)),
          }),
          React.createElement(ReceiptModal, {
            sale: receiptSale,
            onClose: () => setReceiptSale(null),
            onPrint: generateReceiptPDF,
            onWhatsApp: sendWhatsAppReceipt,
          }),
        );
      }

      // ─── APP ──────────────────────────────────────────────────────
      function App() {
        const [session, setSession] = useState(() => {
          try {
            const raw = sessionStorage.getItem("wd_seller_session");
            if (raw) {
              const s = JSON.parse(raw);
              if (Date.now() < s.expiresAt) return s;
            }
          } catch {}
          return null;
        });
        const [theme, setTheme] = useState(
          () => localStorage.getItem("wd_theme") || "dark",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("wd_theme", theme);
        }, [theme]);
        if (!session)
          return React.createElement(LoginPage, { onLogin: setSession });
        return React.createElement(POSDashboard, {
          session: session,
          onLogout: () => {
            sessionStorage.removeItem("wd_seller_session");
            setSession(null);
          },
          theme: theme,
          onThemeChange: () => setTheme(theme === "dark" ? "light" : "dark"),
        });
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
</html>
