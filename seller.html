<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"
    />
    <title>Seller POS — White Dove Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#EFF6FF",
                100: "#DBEAFE",
                200: "#BFDBFE",
                300: "#93C5FD",
                400: "#60A5FA",
                500: "#3B82F6",
                600: "#2563EB",
                700: "#1D4ED8",
                800: "#1E40AF",
                900: "#0A3D91",
                950: "#050D1A",
              },
              success: "#10B981",
              warning: "#F59E0B",
              danger: "#EF4444",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              heading: ["Outfit", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      :root[data-theme="light"] {
        --bg: #f1f5f9;
        --bg2: #ffffff;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text2: #475569;
        --text3: #94a3b8;
        --sidebar-bg: #ffffff;
      }
      :root[data-theme="dark"] {
        --bg: #050d1a;
        --bg2: #0d1b30;
        --card: #0d1b30;
        --border: #1a3050;
        --text: #f1f5f9;
        --text2: #94a3b8;
        --text3: #475569;
        --sidebar-bg: #070f1d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: all 0.3s;
      }

      .wd-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        transition: all 0.2s;
      }
      .wd-input {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 0.6rem 0.875rem;
        font-size: 0.875rem;
        width: 100%;
        outline: none;
      }
      .wd-input:focus {
        border-color: #3b82f6;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 10px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        color: var(--text2);
        background: transparent;
        border: none;
        width: 100%;
      }
      .nav-item:hover {
        background: var(--bg2);
        color: var(--text);
      }
      .nav-item.active {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
        font-weight: 600;
      }

      /* MOBILE RESPONSIVE */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed !important;
          bottom: 0 !important;
          top: auto !important;
          left: 0 !important;
          right: 0 !important;
          width: 100% !important;
          height: 65px !important;
          flex-direction: row !important;
          background: var(--card);
          border-top: 1px solid var(--border);
          z-index: 50;
          padding: 0 0.5rem !important;
          overflow-x: auto !important;
        }
        .sidebar .nav-text {
          display: none !important;
        }
        .sidebar .nav-item {
          padding: 0.4rem 0.6rem !important;
          justify-content: center !important;
          font-size: 0.7rem !important;
          flex-shrink: 0;
        }
        .sidebar .brand-text {
          display: none !important;
        }
        .main-content {
          padding: 1rem !important;
          padding-bottom: 80px !important;
        }
        .pos-layout {
          grid-template-columns: 1fr !important;
        }
        .pos-cart {
          height: 350px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { useState, useEffect } = React;

      // ─── SHARED DATA (Matches Manager) ──────────────────────────
      const BROADCAST_KEY = "wd_realtime_channel";
      const STORAGE_KEY = "wd_shared_data";
      const AUTH_KEY = "wd_seller_session";
      const SELLER_USERS = [
        {
          id: "s1",
          name: "White Dove Solutions",
          email: "Solutionswhitedoveelectrical@gmail.com",
          password: "Whitedove2026",
          role: "seller",
          avatar: "WD",
        },
      ];

      const fmt = (n) =>
        `SLE ${Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const getSharedData = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      };
      const saveSharedData = (data) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch {}
      };

      // ─── LOGIN ────────────────────────────────────────────────────
      function LoginPage({ onLogin }) {
        const [email, setEmail] = useState(
          "Solutionswhitedoveelectrical@gmail.com",
        );
        const [password, setPassword] = useState("Whitedove2026");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        const handleSubmit = (e) => {
          e.preventDefault();
          setLoading(true);
          setError("");
          setTimeout(() => {
            const user = SELLER_USERS.find(
              (u) => u.email === email && u.password === password,
            );
            if (user) {
              const session = {
                userId: user.id,
                userName: user.name,
                avatar: user.avatar,
                role: "seller",
                expiresAt: Date.now() + 8 * 60 * 60 * 1000,
              };
              sessionStorage.setItem(AUTH_KEY, JSON.stringify(session));
              onLogin(session);
            } else {
              setError("Invalid credentials.");
            }
            setLoading(false);
          }, 600);
        };
        return React.createElement(
          "div",
          {
            style: {
              minHeight: "100vh",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              background: "var(--bg)",
              padding: "1.5rem",
            },
          },
          React.createElement(
            "div",
            {
              className: "wd-card",
              style: {
                maxWidth: "400px",
                width: "100%",
                padding: "2rem",
                borderRadius: "20px",
              },
            },
            React.createElement(
              "div",
              { style: { textAlign: "center", marginBottom: "2rem" } },
              React.createElement("div", { style: { fontSize: "3rem" } }, "🕊️"),
              React.createElement(
                "h1",
                {
                  className: "font-heading",
                  style: { fontSize: "1.5rem", fontWeight: 700 },
                },
                "Seller POS",
              ),
            ),
            React.createElement(
              "form",
              {
                onSubmit: handleSubmit,
                style: {
                  display: "flex",
                  flexDirection: "column",
                  gap: "1rem",
                },
              },
              React.createElement("input", {
                type: "email",
                className: "wd-input",
                value: email,
                onChange: (e) => setEmail(e.target.value),
                placeholder: "Email",
                required: true,
              }),
              React.createElement("input", {
                type: "password",
                className: "wd-input",
                value: password,
                onChange: (e) => setPassword(e.target.value),
                placeholder: "Password",
                required: true,
              }),
              error &&
                React.createElement(
                  "div",
                  { style: { color: "#EF4444", fontSize: "0.8rem" } },
                  error,
                ),
              React.createElement(
                "button",
                {
                  type: "submit",
                  disabled: loading,
                  style: {
                    padding: "0.875rem",
                    background: loading ? "#1A3050" : "#0A3D91",
                    color: "white",
                    border: "none",
                    borderRadius: "12px",
                    fontWeight: 600,
                    cursor: loading ? "not-allowed" : "pointer",
                  },
                },
                loading ? "Signing in..." : "Sign In",
              ),
            ),
          ),
        );
      }

      // ─── POS DASHBOARD ──────────────────────────────────────────
      function POSDashboard({ session, onLogout, theme, onThemeChange }) {
        const sharedData = getSharedData() || { products: [], sales: [] };
        const [products, setProducts] = useState(sharedData.products);
        const [cart, setCart] = useState([]);
        const [customerName, setCustomerName] = useState("");
        const [customerPhone, setCustomerPhone] = useState("");
        const [toast, setToast] = useState(null);

        // Real-time Sync from Manager
        useEffect(() => {
          const bc = new BroadcastChannel(BROADCAST_KEY);
          bc.onmessage = (e) => {
            if (e.data.type === "SYNC_STATE") {
              setProducts(e.data.products);
              saveSharedData(e.data);
            }
          };
          // Request initial sync
          bc.postMessage({ type: "SYNC_REQUEST" });
          return () => bc.close();
        }, []);

        useEffect(() => {
          if (toast) setTimeout(() => setToast(null), 3000);
        }, [toast]);

        const addToCart = (product) => {
          if (product.stock <= 0) {
            setToast({ type: "error", msg: "Out of stock!" });
            return;
          }
          const existing = cart.find((i) => i.id === product.id);
          if (existing)
            setCart(
              cart.map((i) =>
                i.id === product.id ? { ...i, qty: i.qty + 1 } : i,
              ),
            );
          else setCart([...cart, { ...product, qty: 1 }]);
          setToast({
            type: "success",
            msg: `Added ${product.emoji} ${product.name}`,
          });
        };

        const completeSale = () => {
          if (cart.length === 0 || !customerName.trim()) {
            setToast({ type: "error", msg: "Fill name and cart!" });
            return;
          }
          const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
          const sale = {
            id: `s${Date.now()}`,
            receiptNo: `WD-${Date.now().toString().slice(-4)}`,
            sellerName: session.userName,
            items: cart.map((i) => ({
              productId: i.id,
              name: i.name,
              qty: i.qty,
              unitPrice: i.price,
              total: i.price * i.qty,
            })),
            total,
            payment: "Cash",
            customer: customerName.trim(),
            customerPhone: customerPhone.trim() || "N/A",
            timestamp: new Date().toISOString(),
          };

          // 1. Update Local State
          const updatedProducts = products.map((p) => {
            const sold = cart.find((i) => i.id === p.id);
            return sold ? { ...p, stock: Math.max(0, p.stock - sold.qty) } : p;
          });
          setProducts(updatedProducts);
          setCart([]);
          setCustomerName("");
          setCustomerPhone("");

          // 2. Broadcast to Manager
          const bc = new BroadcastChannel(BROADCAST_KEY);
          const sharedData = getSharedData();
          const newSales = [sale, ...(sharedData?.sales || [])];
          bc.postMessage({
            type: "SYNC_STATE",
            products: updatedProducts,
            sales: newSales,
          });
          setToast({ type: "success", msg: `✅ Sale Complete! ${fmt(total)}` });
        };

        return React.createElement(
          "div",
          {
            style: {
              minHeight: "100vh",
              background: "var(--bg)",
              paddingBottom: "80px",
            },
          },
          // Top Bar
          React.createElement(
            "div",
            {
              style: {
                padding: "1rem 2rem",
                background: "var(--card)",
                borderBottom: "1px solid var(--border)",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                flexWrap: "wrap",
              },
            },
            React.createElement(
              "div",
              {
                style: { display: "flex", alignItems: "center", gap: "0.5rem" },
              },
              React.createElement(
                "span",
                { style: { fontSize: "1.5rem" } },
                "🕊️",
              ),
              React.createElement(
                "span",
                {
                  className: "font-heading",
                  style: { fontWeight: 800, color: "#0A3D91" },
                },
                "White Dove POS",
              ),
            ),
            React.createElement(
              "div",
              { style: { display: "flex", gap: "1rem" } },
              React.createElement(
                "button",
                {
                  onClick: () =>
                    onThemeChange(theme === "dark" ? "light" : "dark"),
                  style: {
                    background: "none",
                    border: "none",
                    fontSize: "1.2rem",
                    cursor: "pointer",
                  },
                },
                theme === "dark" ? "☀️" : "🌙",
              ),
              React.createElement(
                "button",
                {
                  onClick: onLogout,
                  style: {
                    background: "none",
                    border: "1px solid var(--border)",
                    borderRadius: "8px",
                    padding: "0.3rem 0.8rem",
                    color: "var(--text2)",
                    cursor: "pointer",
                  },
                },
                "Logout",
              ),
            ),
          ),

          // Mobile Sidebar
          React.createElement(
            "div",
            { className: "sidebar", style: { padding: "0.5rem" } },
            React.createElement(
              "div",
              {
                className: "nav-item active",
                style: { justifyContent: "center" },
              },
              React.createElement("span", null, "🛒"),
              React.createElement("span", { className: "nav-text" }, "POS"),
            ),
            React.createElement(
              "div",
              {
                className: "nav-item",
                onClick: onLogout,
                style: { color: "#EF4444", justifyContent: "center" },
              },
              React.createElement("span", null, "🚪"),
              React.createElement("span", { className: "nav-text" }, "Exit"),
            ),
          ),

          // Main POS Area
          React.createElement(
            "div",
            {
              className: "main-content",
              style: { padding: "2rem", maxWidth: "1300px", margin: "0 auto" },
            },
            React.createElement(
              "div",
              {
                className: "pos-layout",
                style: {
                  display: "grid",
                  gridTemplateColumns: "1fr 340px",
                  gap: "1.5rem",
                },
              },
              // Product List
              React.createElement(
                "div",
                {
                  style: {
                    display: "flex",
                    flexDirection: "column",
                    gap: "1rem",
                  },
                },
                React.createElement("input", {
                  className: "wd-input",
                  placeholder: "🔍 Search products...",
                  style: { fontSize: "1rem", padding: "0.8rem" },
                }),
                React.createElement(
                  "div",
                  {
                    style: {
                      display: "grid",
                      gridTemplateColumns:
                        "repeat(auto-fill, minmax(150px, 1fr))",
                      gap: "0.75rem",
                      maxHeight: "600px",
                      overflowY: "auto",
                      padding: "0.2rem",
                    },
                  },
                  products.map((p) =>
                    React.createElement(
                      "div",
                      {
                        key: p.id,
                        className: "wd-card",
                        style: {
                          padding: "0.8rem",
                          textAlign: "center",
                          background: "var(--bg)",
                        },
                      },
                      React.createElement(
                        "div",
                        { style: { fontSize: "1.5rem" } },
                        p.emoji,
                      ),
                      React.createElement(
                        "div",
                        {
                          style: {
                            fontWeight: 600,
                            fontSize: "0.8rem",
                            margin: "0.25rem 0",
                          },
                        },
                        p.name,
                      ),
                      React.createElement(
                        "div",
                        { style: { fontWeight: 700, color: "#10B981" } },
                        fmt(p.price),
                      ),
                      React.createElement(
                        "div",
                        {
                          style: {
                            fontSize: "0.7rem",
                            color: p.stock <= 2 ? "#EF4444" : "var(--text3)",
                          },
                        },
                        p.stock <= 0 ? "Out of Stock" : `${p.stock} left`,
                      ),
                      React.createElement(
                        "button",
                        {
                          onClick: () => addToCart(p),
                          disabled: p.stock <= 0,
                          style: {
                            marginTop: "0.5rem",
                            width: "100%",
                            padding: "0.3rem",
                            borderRadius: "8px",
                            border: "none",
                            background:
                              p.stock > 0
                                ? "linear-gradient(135deg, #0A3D91, #1255C4)"
                                : "var(--bg)",
                            color: p.stock > 0 ? "white" : "var(--text3)",
                            fontWeight: 600,
                            cursor: p.stock > 0 ? "pointer" : "not-allowed",
                          },
                        },
                        p.stock > 0 ? "Add +" : "Sold Out",
                      ),
                    ),
                  ),
                ),
              ),
              // Cart
              React.createElement(
                "div",
                {
                  className: "wd-card pos-cart",
                  style: {
                    padding: "1.25rem",
                    display: "flex",
                    flexDirection: "column",
                    gap: "0.75rem",
                    height: "fit-content",
                    maxHeight: "500px",
                    position: "sticky",
                    top: "1.5rem",
                  },
                },
                React.createElement(
                  "div",
                  {
                    style: { display: "flex", justifyContent: "space-between" },
                  },
                  React.createElement(
                    "div",
                    { className: "font-heading", style: { fontWeight: 700 } },
                    "🛒 Order",
                  ),
                  React.createElement(
                    "span",
                    { style: { fontSize: "0.8rem", color: "var(--text3)" } },
                    cart.length + " items",
                  ),
                ),
                React.createElement("input", {
                  className: "wd-input",
                  placeholder: "Customer Name *",
                  value: customerName,
                  onChange: (e) => setCustomerName(e.target.value),
                }),
                React.createElement("input", {
                  className: "wd-input",
                  placeholder: "Phone (Optional)",
                  value: customerPhone,
                  onChange: (e) => setCustomerPhone(e.target.value),
                }),
                React.createElement(
                  "div",
                  {
                    style: {
                      flex: 1,
                      maxHeight: "200px",
                      overflowY: "auto",
                      borderTop: "1px solid var(--border)",
                      borderBottom: "1px solid var(--border)",
                      padding: "0.5rem 0",
                    },
                  },
                  cart.length === 0
                    ? React.createElement(
                        "div",
                        {
                          style: {
                            textAlign: "center",
                            padding: "1rem",
                            color: "var(--text3)",
                          },
                        },
                        "Add items to start",
                      )
                    : cart.map((item) =>
                        React.createElement(
                          "div",
                          {
                            key: item.id,
                            style: {
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "space-between",
                              padding: "0.3rem 0",
                              borderBottom: "1px solid var(--border)",
                            },
                          },
                          React.createElement(
                            "div",
                            null,
                            React.createElement(
                              "div",
                              {
                                style: { fontWeight: 600, fontSize: "0.8rem" },
                              },
                              item.emoji,
                              " ",
                              item.name,
                            ),
                            React.createElement(
                              "div",
                              {
                                style: {
                                  fontSize: "0.7rem",
                                  color: "var(--text3)",
                                },
                              },
                              fmt(item.price),
                            ),
                          ),
                          React.createElement(
                            "div",
                            {
                              style: {
                                display: "flex",
                                alignItems: "center",
                                gap: "0.3rem",
                              },
                            },
                            React.createElement(
                              "button",
                              {
                                onClick: () =>
                                  setCart(
                                    cart
                                      .map((i) =>
                                        i.id === item.id
                                          ? {
                                              ...i,
                                              qty: Math.max(1, i.qty - 1),
                                            }
                                          : i,
                                      )
                                      .filter((i) => i.qty > 0),
                                  ),
                                style: {
                                  width: "20px",
                                  height: "20px",
                                  borderRadius: "4px",
                                  border: "1px solid var(--border)",
                                  background: "transparent",
                                  cursor: "pointer",
                                },
                              },
                              "-",
                            ),
                            React.createElement(
                              "span",
                              {
                                style: {
                                  minWidth: "20px",
                                  textAlign: "center",
                                },
                              },
                              item.qty,
                            ),
                            React.createElement(
                              "button",
                              {
                                onClick: () =>
                                  setCart(
                                    cart.map((i) =>
                                      i.id === item.id
                                        ? { ...i, qty: i.qty + 1 }
                                        : i,
                                    ),
                                  ),
                                style: {
                                  width: "20px",
                                  height: "20px",
                                  borderRadius: "4px",
                                  border: "1px solid var(--border)",
                                  background: "transparent",
                                  cursor: "pointer",
                                },
                              },
                              "+",
                            ),
                          ),
                          React.createElement(
                            "span",
                            { style: { fontWeight: 700, color: "#10B981" } },
                            fmt(item.price * item.qty),
                          ),
                        ),
                      ),
                ),
                React.createElement(
                  "div",
                  {
                    style: {
                      display: "flex",
                      justifyContent: "space-between",
                      fontSize: "1.1rem",
                      fontWeight: 800,
                    },
                  },
                  React.createElement("span", null, "Total"),
                  React.createElement(
                    "span",
                    { style: { color: "#10B981" } },
                    fmt(cart.reduce((s, i) => s + i.price * i.qty, 0)),
                  ),
                ),
                React.createElement(
                  "button",
                  {
                    onClick: completeSale,
                    disabled: cart.length === 0,
                    style: {
                      width: "100%",
                      padding: "0.7rem",
                      borderRadius: "12px",
                      border: "none",
                      background: cart.length > 0 ? "#0A3D91" : "var(--bg)",
                      color: cart.length > 0 ? "white" : "var(--text3)",
                      fontWeight: 700,
                      cursor: cart.length > 0 ? "pointer" : "not-allowed",
                    },
                  },
                  "✅ Complete Sale",
                ),
              ),
            ),
          ),
          toast &&
            React.createElement(
              "div",
              {
                style: {
                  position: "fixed",
                  bottom: "2rem",
                  right: "2rem",
                  background: toast.type === "success" ? "#10B981" : "#EF4444",
                  color: "white",
                  padding: "0.75rem 1.5rem",
                  borderRadius: "12px",
                  fontWeight: 600,
                  boxShadow: "0 10px 30px rgba(0,0,0,0.3)",
                  zIndex: 100,
                },
              },
              toast.msg,
            ),
        );
      }

      // ─── APP ──────────────────────────────────────────────────────
      function App() {
        const [session, setSession] = useState(() => {
          try {
            const raw = sessionStorage.getItem(AUTH_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        });
        const [theme, setTheme] = useState(
          () => localStorage.getItem("wd_theme") || "dark",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("wd_theme", theme);
        }, [theme]);

        if (!session)
          return React.createElement(LoginPage, { onLogin: setSession });
        return React.createElement(POSDashboard, {
          session: session,
          onLogout: () => {
            sessionStorage.removeItem(AUTH_KEY);
            setSession(null);
          },
          theme: theme,
          onThemeChange: (t) => setTheme(t),
        });
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
</html>
