        const addToCart = (product) => {
          const existing = cart.find(i => i.id === product.id);
          if (existing) {
            if (existing.qty >= product.stock) return;
            setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));

          }
        };

        const handleCheckout = () => {
          if (cart.length === 0) return;
          const saleItems = cart.map(item => ({ productId: item.id, name: item.name, qty: item.qty, unitPrice: item.price, total: item.price * item.qty }));
          const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
          const newSale = {
            id: `s${Date.now()}`,
            receiptNo: `WD-${String(sales.length + 1).padStart(3, "0")}`,
            sellerName: session.userName,
            items: saleItems,
            total: total,
            customer: "Walk-in Customer",
            timestamp: new Date().toISOString()
          };
          setSales([newSale, ...sales]);
          const updatedProducts = products.map(p => {
            const sold = cart.find(i => i.id === p.id);
            return sold ? { ...p, stock: Math.max(0, p.stock - sold.qty) } : p;
          });
          setProducts(updatedProducts);
          setCart([]);
          setReceiptSale(newSale);
        };

        const navItems = [
          { id: "pos", label: "POS" },
          { id: "dashboard", label: "Dashboard" }
        ];

        return React.createElement("div", { style: { display: "flex", height: "100vh", overflow: "hidden", background: "var(--bg)" } },
          // Sidebar
          React.createElement("div", { className: "sidebar", style: { width: "220px", flexShrink: 0, display: "flex", flexDirection: "column", height: "100vh", position: "sticky", top: 0, overflow: "hidden" } },
            React.createElement("div", { style: { padding: "1.25rem 1rem", borderBottom: "1px solid var(--border)" } },
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "0.6rem" } },
                React.createElement("span", { style: { fontSize: "1.5rem" } }, "🕊️"),
                React.createElement("div", { className: "brand-text" },
                  React.createElement("div", { className: "font-heading", style: { fontSize: "0.8rem", fontWeight: 800, color: "var(--text)" } }, "WHITE DOVE"),
                  React.createElement("div", { style: { fontSize: "0.55rem", color: "var(--text3)" } }, "Seller POS")
                )
              )
            ),
            React.createElement("div", { style: { padding: "0.75rem 1rem", borderBottom: "1px solid var(--border)" } },
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "0.6rem", padding: "0.4rem 0.5rem", background: "rgba(16,185,129,0.08)", borderRadius: "10px" } },
                React.createElement("div", { style: { width: "28px", height: "28px", borderRadius: "8px", background: "linear-gradient(135deg, #059669, #10B981)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, color: "white", fontSize: "0.7rem" } }, session.userName.charAt(0).toUpperCase()),
                React.createElement("div", { className: "seller-name" },
                  React.createElement("div", { style: { fontSize: "0.7rem", fontWeight: 700, color: "var(--text)" } }, session.userName),
                  React.createElement("div", { style: { fontSize: "0.55rem", color: "#34D399", fontWeight: 600 } }, "SELLER")
                )
              )
            ),
            React.createElement("nav", { style: { flex: 1, padding: "0.75rem", display: "flex", flexDirection: "column", gap: "0.25rem", overflowY: "auto" } },
              navItems.map(item =>
                React.createElement("div", { key: item.id, className: `nav-item ${section === item.id ? "active" : ""}`, onClick: () => setSection(item.id), style: { cursor: "pointer", padding: "0.625rem 0.75rem", borderRadius: "10px", fontSize: "0.875rem", fontWeight: 500, color: section === item.id ? "#34D399" : "var(--text2)", background: section === item.id ? "rgba(16,185,129,0.12)" : "transparent" } },
                  React.createElement("span", null, item.label)
                )
              )
            ),
            React.createElement("div", { style: { padding: "0.75rem", borderTop: "1px solid var(--border)" } },
              React.createElement("button", { onClick: onLogout, className: "nav-item", style: { color: "#EF4444", justifyContent: "flex-start", background: "none", border: "none", cursor: "pointer", width: "100%", padding: "0.625rem 0.75rem", borderRadius: "10px", fontSize: "0.875rem", fontWeight: 500, display: "flex", alignItems: "center", gap: "0.75rem" } },
                React.createElement("span", null, "🚪"),
                React.createElement("span", { className: "nav-text" }, "Sign Out")
              )
            )
          ),
          // Main Content
          React.createElement("div", { style: { flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" } },
            React.createElement("div", { style: { padding: "0.7rem 1.5rem", borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "space-between", background: "var(--bg2)", flexWrap: "wrap", gap: "0.5rem" } },
              React.createElement("h1", { className: "font-heading", style: { fontSize: "1.1rem", fontWeight: 800, color: "var(--text)" } }, section === "pos" ? "Point of Sale" : "My Dashboard"),
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "0.5rem" } },
                React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "0.3rem", fontSize: "0.65rem", fontWeight: 600, color: "#10B981", background: "rgba(16,185,129,0.08)", padding: "0.2rem 0.7rem", borderRadius: "100px" } },
                  React.createElement("div", { className: "pulse-dot", style: { width: "6px", height: "6px" } }),
                  "Live"
                )
              )
            ),
            React.createElement("div", { style: { flex: 1, overflowY: "auto", padding: "1.5rem" } },
              section === "pos" ? React.createElement("div", { style: { display: "grid", gridTemplateColumns: "1fr 340px", gap: "1.5rem" } },
                // Products
                React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "1rem" } },
                  React.createElement("input", { className: "wd-input", placeholder: "Search products...", value: searchTerm, onChange: (e) => setSearchTerm(e.target.value) }),
                  React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: "0.75rem", maxHeight: "500px", overflowY: "auto", padding: "0.2rem" } },
                    filteredProducts.map(p => {
                      const inStock = p.stock > 0;
                      return React.createElement("div", { key: p.id, className: "wd-card", style: { padding: "0.8rem", display: "flex", flexDirection: "column", gap: "0.3rem" } },
                        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
                          React.createElement("span", { style: { fontSize: "1.5rem" } }, p.emoji),
                          React.createElement("span", { className: inStock ? "badge-in-stock" : "badge-out-stock", style: { fontSize: "0.55rem", fontWeight: 700, padding: "0.1rem 0.5rem", borderRadius: "100px" } }, inStock ? "In Stock" : "Out")
                        ),
                        React.createElement("div", { style: { fontWeight: 600, fontSize: "0.75rem", color: "var(--text)" } }, p.name),
                        React.createElement("div", { style: { fontWeight: 700, color: "#10B981", fontSize: "0.8rem" } }, fmt(p.price)),
                        React.createElement("div", { style: { fontSize: "0.6rem", color: "var(--text3)" } }, "📦 " + p.stock),
                        React.createElement("button", { onClick: () => addToCart(p), disabled: !inStock, style: { width: "100%", padding: "0.3rem", borderRadius: "8px", border: "none", background: inStock ? "linear-gradient(135deg, #059669, #10B981)" : "var(--bg)", color: inStock ? "white" : "var(--text3)", fontWeight: 600, cursor: inStock ? "pointer" : "not-allowed", fontSize: "0.7rem" } }, inStock ? "Add" : "Out of Stock")
                      );
                    })
                  )
                ),
                // Cart
                React.createElement("div", { className: "wd-card cart-side", style: { padding: "1.25rem", display: "flex", flexDirection: "column", gap: "0.75rem", height: "100%", minHeight: "380px" } },
                  React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
                    React.createElement("div", { className: "font-heading", style: { fontWeight: 700, color: "var(--text)", fontSize: "1rem" } }, "🛒 Order"),
                    React.createElement("span", { style: { fontSize: "0.65rem", color: "var(--text3)", background: "var(--bg)", padding: "0.1rem 0.5rem", borderRadius: "6px" } }, cart.length + " items")
                  ),
                  React.createElement("div", { style: { flex: 1, overflowY: "auto", maxHeight: "200px" } },
                    cart.length === 0 ? React.createElement("div", { style: { textAlign: "center", padding: "1.5rem 0", color: "var(--text3)" } }, "🛒 Empty") :
                      cart.map(item => React.createElement("div", { key: item.id, style: { display: "flex", alignItems: "center", gap: "0.4rem", padding: "0.4rem", background: "var(--bg)", borderRadius: "8px", marginBottom: "0.3rem" } },
                        React.createElement("span", null, item.emoji),
                        React.createElement("div", { style: { flex: 1, minWidth: 0 } },
                          React.createElement("div", { style: { fontSize: "0.7rem", fontWeight: 600, color: "var(--text)" } }, item.name),
                          React.createElement("div", { style: { fontSize: "0.6rem", color: "var(--text3)" } }, fmt(item.price))
                        ),
                        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "0.2rem" } },
                          React.createElement("button", { onClick: () => { if (item.qty > 1) setCart(cart.map(i => i.id === item.id ? { ...i, qty: i.qty - 1 } : i)); else setCart(cart.filter(i => i.id !== item.id)); }, style: { width: "22px", height: "22px", borderRadius: "6px", border: "1px solid var(--border)", background: "var(--bg)", color: "var(--text)", cursor: "pointer" } }, "−"),
                          React.createElement("span", { style: { fontWeight: 700, minWidth: "16px", textAlign: "center", fontSize: "0.75rem" } }, item.qty),
                          React.createElement("button", { onClick: () => { if (item.qty < item.stock) setCart(cart.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i)); }, style: { width: "22px", height: "22px", borderRadius: "6px", border: "1px solid var(--border)", background: "var(--bg)", color: "var(--text)", cursor: "pointer" } }, "+")
                        ),
                        React.createElement("div", { style: { fontWeight: 700, color: "#10B981", fontSize: "0.7rem", minWidth: "50px", textAlign: "right" } }, fmt(item.price * item.qty)),
                        React.createElement("button", { onClick: () => setCart(cart.filter(i => i.id !== item.id)), style: { background: "none", border: "none", color: "#EF4444", cursor: "pointer" } }, "✕")
                      ))
                  ),
                  React.createElement("div", { style: { borderTop: "1px solid var(--border)", paddingTop: "0.75rem" } },
                    React.createElement("div", { style: { display: "flex", justifyContent: "space-between", fontSize: "1.1rem", fontWeight: 800 } },
                      React.createElement("span", null, "Total"),
                      React.createElement("span", { style: { color: "#10B981" } }, fmt(cart.reduce((s, i) => s + i.price * i.qty, 0)))
                    ),
                    React.createElement("button", { onClick: handleCheckout, disabled: cart.length === 0, style: { width: "100%", marginTop: "0.5rem", padding: "0.7rem", borderRadius: "12px", border: "none", background: cart.length === 0 ? "var(--bg)" : "linear-gradient(135deg, #059669, #10B981)", color: cart.length === 0 ? "var(--text3)" : "white", fontWeight: 700, fontSize: "0.9rem", cursor: cart.length === 0 ? "not-allowed" : "pointer" } },
                      React.createElement("span", null, "✅ Complete Sale")
                    )
                  )
                )
              ) : React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "1.5rem" } },
                React.createElement("div", { className: "wd-card", style: { padding: "1.5rem 2rem", background: "linear-gradient(135deg, rgba(16,185,129,0.05), rgba(10,61,145,0.05))" } },
                  React.createElement("div", { className: "font-heading", style: { fontSize: "1.4rem", fontWeight: 800, color: "var(--text)" } }, "👋 Welcome " + session.userName),
                  React.createElement("div", { style: { color: "var(--text2)" } }, "Seller · White Dove Engineering")
                ),
                React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: "1rem" } },
                  React.createElement("div", { className: "wd-card kpi-card", style: { padding: "1.25rem", display: "flex", flexDirection: "column", gap: "0.5rem" } },
                    React.createElement("span", { style: { fontSize: "0.7rem", fontWeight: 600, color: "var(--text2)" } }, "Total Sales"),
                    React.createElement("span", { className: "font-heading", style: { fontSize: "1.5rem", fontWeight: 800, color: "#10B981" } }, sales.length)
                  ),
                  React.createElement("div", { className: "wd-card kpi-card", style: { padding: "1.25rem", display: "flex", flexDirection: "column", gap: "0.5rem" } },
                    React.createElement("span", { style: { fontSize: "0.7rem", fontWeight: 600, color: "var(--text2)" } }, "Revenue"),
                    React.createElement("span", { className: "font-heading", style: { fontSize: "1.5rem", fontWeight: 800, color: "#0A3D91" } }, fmt(sales.reduce((a, s) => a + s.total, 0)))
                  )
                ),
                React.createElement("div", { className: "wd-card", style: { overflow: "hidden" } },
                  React.createElement("div", { style: { padding: "0.8rem 1.5rem", borderBottom: "1px solid var(--border)" } },
                    React.createElement("div", { className: "font-heading", style: { fontWeight: 700, color: "var(--text)", fontSize: "0.9rem" } }, "📋 Recent Sales")
                  ),
                  React.createElement("div", { style: { maxHeight: "300px", overflowY: "auto" } },
                    sales.length === 0 ? React.createElement("div", { style: { textAlign: "center", padding: "2rem", color: "var(--text3)" } }, "No sales yet") :
                      React.createElement("table", { style: { width: "100%", borderCollapse: "collapse" }, className: "wd-table" },
                        React.createElement("thead", null,
                          React.createElement("tr", null,
                            React.createElement("th", { style: { textAlign: "left", padding: "0.5rem 1rem", fontSize: "0.6rem", color: "var(--text3)", borderBottom: "1px solid var(--border)" } }, "Receipt"),
                            React.createElement("th", { style: { textAlign: "right", padding: "0.5rem 1rem", fontSize: "0.6rem", color: "var(--text3)", borderBottom: "1px solid var(--border)" } }, "Total"),
                            React.createElement("th", { style: { textAlign: "left", padding: "0.5rem 1rem", fontSize: "0.6rem", color: "var(--text3)", borderBottom: "1px solid var(--border)" } }, "Time")
                          )
                        ),
                        React.createElement("tbody", null,
                          sales.slice(0, 10).map(s => React.createElement("tr", { key: s.id },
                            React.createElement("td", { style: { padding: "0.4rem 1rem", fontSize: "0.75rem", color: "#60A5FA", fontFamily: "monospace" } }, s.receiptNo),
                            React.createElement("td", { style: { padding: "0.4rem 1rem", fontSize: "0.8rem", fontWeight: 700, color: "#10B981", textAlign: "right" } }, fmt(s.total)),
                            React.createElement("td", { style: { padding: "0.4rem 1rem", fontSize: "0.65rem", color: "var(--text3)" } }, new Date(s.timestamp).toLocaleTimeString())
                          ))
                        )
                      )
                  )
                )
              )
            )
          )
        );
      }

      // ─── APP ──────────────────────────────────────────────────────
      function App() {
        const [session, setSession] = useState(() => {
          try {
            const raw = sessionStorage.getItem("wd_seller_session");
            if (raw) {
              const s = JSON.parse(raw);
              if (Date.now() < s.expiresAt) return s;
            }
          } catch {}
          return null;
        });

        if (!session) {
          return React.createElement(LoginPage, { onLogin: setSession });
        }

        return React.createElement(POSDashboard, { session: session, onLogout: () => {
          sessionStorage.removeItem("wd_seller_session");
          setSession(null);
        }});
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
