        inset: -3px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.3);
        animation: pulse 2s infinite;

      const InventorySection = ({ products, onUpdate }) => {
        const [search, setSearch] = useState("");
        const [catFilter, setCatFilter] = useState("All");
        const [stockFilter, setStockFilter] = useState("All");
        const [showModal, setShowModal] = useState(false);
        const [editProduct, setEditProduct] = useState(null);
        const cats = [
          "All",
          ...Array.from(new Set(products.map((p) => p.category))),
        ];
        const filtered = useMemo(
          () =>
            products.filter((p) => {
              const ms = search.toLowerCase();
              const matchS =
                p.name.toLowerCase().includes(ms) ||
                p.sku.toLowerCase().includes(ms);
              const matchC = catFilter === "All" || p.category === catFilter;
              const matchSt =
                stockFilter === "All" ||
                (stockFilter === "Low" &&
                  p.stock > 0 &&
                  p.stock <= p.minStock) ||
                (stockFilter === "Out" && p.stock === 0) ||
                (stockFilter === "In" && p.stock > p.minStock);
              return matchS && matchC && matchSt;
            }),
          [products, search, catFilter, stockFilter],
        );
        const handleSave = (prod) => {
          onUpdate((prev) =>
            prev.some((p) => p.id === prod.id)
              ? prev.map((p) => (p.id === prod.id ? prod : p))
              : [prod, ...prev],
          );
          setShowModal(false);
          setEditProduct(null);
        };
        const handleDelete = (id) => {
          if (confirm("Delete this product from inventory?"))
            onUpdate((prev) => prev.filter((p) => p.id !== id));
        };
        const getBadge = (p) => {
          if (p.stock === 0)
            return { text: "Out of Stock", cls: "badge-out-stock" };
          if (p.stock <= p.minStock)
            return { text: "Low Stock", cls: "badge-low-stock" };
          return { text: "In Stock", cls: "badge-in-stock" };
        };

        return (
          <div
            style={{ display: "flex", flexDirection: "column", gap: "1.25rem" }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                flexWrap: "wrap",
                gap: "0.75rem",
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: "0.75rem",
                  flexWrap: "wrap",
                }}
              >
                <div style={{ position: "relative" }}>
                  <Icon
                    name="search"
                    size={16}
                    style={{
                      position: "absolute",
                      left: "0.75rem",
                      top: "50%",
                      transform: "translateY(-50%)",
                      color: "var(--text3)",
                    }}
                  />

                    className="wd-input"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}

                  value={catFilter}

                <select
                  className="wd-input"
                  value={stockFilter}
                  onChange={(e) => setStockFilter(e.target.value)}

                    <option key={s} value={s}>
                      {s === "All"
                        ? "All Stock"
                        : s === "In"
                          ? "In Stock"
                          : s === "Low"
                            ? "Low Stock"
                            : "Out of Stock"}
                    </option>
                  ))}
                </select>
              </div>

                onClick={() => {
                  setEditProduct(null);
                  setShowModal(true);

                  padding: "0.625rem 1.25rem",

                  border: "none",
                  fontWeight: 700,
                  cursor: "pointer",

            </div>
            <div
              className="wd-card"
              style={{ borderRadius: "16px", overflow: "hidden" }}
            >
              <div
                style={{
                  padding: "1rem 1.5rem",
                  borderBottom: "1px solid var(--border)",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  flexWrap: "wrap",
                  gap: "0.5rem",
                }}
              >
                <div
                  className="font-heading"
                  style={{
                    fontWeight: 700,
                    color: "var(--text)",
                    fontSize: "0.95rem",
                  }}

                  Inventory ({filtered.length} products)

                <div style={{ fontSize: "0.75rem", color: "var(--text3)" }}>
                  Low:{" "}
                  <span style={{ color: "#F59E0B", fontWeight: 700 }}>
                    {
                      products.filter(
                        (p) => p.stock > 0 && p.stock <= p.minStock,
                      ).length

                  </span>{" "}

                    {products.filter((p) => p.stock === 0).length}

              <div style={{ overflowX: "auto" }}>
                <table
                  style={{ width: "100%", borderCollapse: "collapse" }}

                  <thead>
                    <tr>
                      <th style={{ textAlign: "left" }}>Product</th>
                      <th style={{ textAlign: "left" }}>SKU</th>
                      <th style={{ textAlign: "left" }}>Category</th>
                      <th style={{ textAlign: "center" }}>Stock</th>
                      <th style={{ textAlign: "right" }}>Unit Price</th>
                      <th style={{ textAlign: "center" }}>Status</th>
                      <th style={{ textAlign: "right" }}>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((p) => {
                      const badge = getBadge(p);
                      return (
                        <tr key={p.id}>
                          <td>
                            <div
                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: "0.625rem",
                              }}
                            >
                              <span style={{ fontSize: "1.25rem" }}>
                                {p.emoji}
                              </span>
                              <div>
                                <div
                                  style={{
                                    fontWeight: 600,
                                    color: "var(--text)",
                                    fontSize: "0.875rem",
                                  }}
                                >
                                  {p.name}
                                </div>
                                <div
                                  style={{
                                    fontSize: "0.7rem",
                                    color: "var(--text3)",
                                  }}
                                >
                                  {p.description?.slice(0, 40)}...
                                </div>
                              </div>
                            </div>
                          </td>
                          <td
                            style={{
                              fontFamily: "monospace",
                              fontSize: "0.78rem",
                              color: "var(--text2)",
                            }}
                          >
                            {p.sku}
                          </td>
                          <td>
                            <span
                              style={{
                                fontSize: "0.75rem",
                                color: "var(--text2)",
                                background: "var(--bg)",
                                border: "1px solid var(--border)",
                                padding: "0.2rem 0.5rem",
                                borderRadius: "6px",
                              }}
                            >
                              {p.category}
                            </span>
                          </td>
                          <td
                            style={{
                              textAlign: "center",
                              fontWeight: 700,
                              fontSize: "0.9rem",
                              color:
                                p.stock === 0
                                  ? "#EF4444"
                                  : p.stock <= p.minStock
                                    ? "#F59E0B"
                                    : "var(--text)",
                            }}
                          >
                            {p.stock}{" "}
                            <span
                              style={{
                                fontWeight: 400,
                                fontSize: "0.7rem",
                                color: "var(--text3)",
                              }}
                            >
                              / {p.minStock} min

                          </td>
                          <td
                            style={{
                              textAlign: "right",
                              fontWeight: 700,
                              color: "#0A3D91",
                              fontSize: "0.875rem",

                          <td style={{ textAlign: "center" }}>
                            <span
                              className={badge.cls}
                              style={{
                                fontSize: "0.7rem",
                                fontWeight: 700,
                                padding: "0.2rem 0.625rem",
                                borderRadius: "100px",
                              }}
                            >
                              {badge.text}
                            </span>
                          </td>
                          <td style={{ textAlign: "right" }}>
                            <div
                              style={{
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "flex-end",
                                gap: "0.375rem",
                              }}
                            >
                              <button
                                onClick={() => {
                                  setEditProduct(p);
                                  setShowModal(true);
                                }}
                                style={{
                                  padding: "0.375rem",
                                  borderRadius: "8px",
                                  background: "var(--bg)",
                                  border: "1px solid var(--border)",
                                  color: "var(--text2)",
                                  cursor: "pointer",
                                }}
                              >
                                <Icon name="edit" size={15} />
                              </button>
                              <button
                                onClick={() => handleDelete(p.id)}
                                style={{
                                  padding: "0.375rem",
                                  borderRadius: "8px",
                                  background: "rgba(239,68,68,0.08)",

                                  color: "#EF4444",
                                  cursor: "pointer",
                                }}
                              >
                                <Icon name="trash" size={15} />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
            {showModal && (
              <ProductModal
                product={editProduct}
                onSave={handleSave}
                onClose={() => {
                  setShowModal(false);
                  setEditProduct(null);
                }}
              />
            )}
          </div>
        );
      };

      const SalesSection = ({ sales }) => {
        const [search, setSearch] = useState("");
        const [view, setView] = useState(null);
        const filtered = useMemo(
          () =>
            sales.filter(
              (s) =>
                s.receiptNo?.toLowerCase().includes(search.toLowerCase()) ||
                s.sellerName?.toLowerCase().includes(search.toLowerCase()) ||
                s.customer?.toLowerCase().includes(search.toLowerCase()),
            ),
          [sales, search],
        );

        const generateReceiptPDF = (sale) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: "mm", format: "a4" });
          const pageWidth = 210;
          let y = 20;
          doc.setFontSize(20);
          doc.setTextColor("#0A3D91");
          doc.setFont("helvetica", "bold");
          doc.text("WHITE DOVE", pageWidth / 2, y, { align: "center" });
          y += 8;
          doc.setFontSize(10);
          doc.setTextColor("#475569");
          doc.setFont("helvetica", "normal");
          doc.text("ENGINEERING FIRM", pageWidth / 2, y, { align: "center" });
          y += 6;
          doc.text(
            "Building Your Vision, Powering Your Future.",
            pageWidth / 2,
            y,
            { align: "center" },
          );
          y += 6;
          doc.text(
            "+232 75 862 299 · Freetown, Sierra Leone",
            pageWidth / 2,
            y,
            { align: "center" },
          );
          y += 10;
          doc.setDrawColor("#0A3D91");
          doc.line(20, y, pageWidth - 20, y);
          y += 8;
          doc.setFontSize(10);
          doc.setTextColor("#0F172A");
          doc.setFont("helvetica", "bold");
          doc.text(`Receipt: ${sale.receiptNo}`, 20, y);
          doc.text(`Date: ${fmtDate(sale.timestamp)}`, 110, y);
          y += 6;
          doc.text(`Customer: ${sale.customer}`, 20, y);
          doc.text(`Payment: ${sale.payment}`, 110, y);
          y += 6;
          doc.text(`Seller: ${sale.sellerName}`, 20, y);
          y += 10;
          doc.line(20, y, pageWidth - 20, y);
          y += 6;
          doc.setFont("helvetica", "bold");
          doc.setTextColor("#64748B");
          doc.text("Item", 20, y);
          doc.text("Qty", 130, y);
          doc.text("Price", 150, y);
          doc.text("Total", 180, y);
          y += 4;
          doc.line(20, y, pageWidth - 20, y);
          y += 6;
          doc.setFont("helvetica", "normal");
          doc.setTextColor("#0F172A");
          sale.items.forEach((item) => {
            const name =
              item.name.length > 25
                ? item.name.substring(0, 23) + "..."
                : item.name;
            doc.text(name, 20, y);
            doc.text(item.qty.toString(), 130, y);
            doc.text(fmt(item.unitPrice), 150, y);
            doc.text(fmt(item.total), 180, y, { align: "right" });
            y += 6;
          });
          y += 4;
          doc.line(20, y, pageWidth - 20, y);
          y += 6;
          if (sale.discount > 0) {
            doc.text(`Discount (${sale.discount}%)`, 20, y);
            doc.text(
              `-${fmt((sale.subtotal * sale.discount) / 100)}`,
              pageWidth - 20,
              y,
              { align: "right" },
            );
            y += 6;
          }
          doc.setFont("helvetica", "bold");
          doc.setTextColor("#0A3D91");
          doc.setFontSize(14);
          doc.text("TOTAL", 20, y);
          doc.text(fmt(sale.total), pageWidth - 20, y, { align: "right" });
          y += 10;
          doc.setFontSize(9);
          doc.setTextColor("#94A3B8");
          doc.setFont("helvetica", "normal");
          doc.text(
            "Thank you for choosing White Dove Engineering Firm!",
            pageWidth / 2,
            y,
            { align: "center" },
          );
          y += 5;
          doc.text(
            "Quality Work · Reliable Solutions · Your Satisfaction, Our Mission.",
            pageWidth / 2,
            y,
            { align: "center" },
          );
          doc.save(`receipt_${sale.receiptNo}.pdf`);
        };

          <div
            style={{ display: "flex", flexDirection: "column", gap: "1.25rem" }}
          >
            <div
              style={{
                display: "flex",
                gap: "0.75rem",

              </div>
              <div style={{ overflowX: "auto" }}>
                <table
                  style={{ width: "100%", borderCollapse: "collapse" }}
                  className="wd-table"
                >
                  <thead>
                    <tr>
                      <th style={{ textAlign: "left" }}>Receipt</th>
                      <th style={{ textAlign: "left" }}>Seller</th>
                      <th style={{ textAlign: "left" }}>Customer</th>
                      <th style={{ textAlign: "left" }}>Items</th>
                      <th style={{ textAlign: "left" }}>Payment</th>
                      <th style={{ textAlign: "right" }}>Total</th>
                      <th style={{ textAlign: "left" }}>Date</th>
                      <th style={{ textAlign: "center" }}>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((s) => (
                      <tr key={s.id}>
                        <td>
                          <span
                            style={{
                              fontWeight: 700,
                              fontSize: "0.8rem",
                              color: "#60A5FA",

                              style={{
                                padding: "0.3rem 0.625rem",

                                background: "var(--bg)",
                                border: "1px solid var(--border)",

                                padding: "0.25rem 0.625rem",

                              <Icon name="whatsapp" size={14} />
                            </button>

                              style={{
                                padding: "0.25rem 0.625rem",
                                borderRadius: "8px",
                                background: "#0A3D91",
                                border: "none",
                                color: "white",
                                cursor: "pointer",
                                fontSize: "0.7rem",
                              }}
                            >
                              <Icon name="download" size={14} />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
            {view && (
              <div

                onClick={(e) => e.target === e.currentTarget && setView(null)}
              >
                <div className="modal-box" id="receipt-print">
                  <div
                    style={{
                      padding: "1.5rem",
                      borderBottom: "1px solid var(--border)",
                      display: "flex",
                      justifyContent: "space-between",

                      flexWrap: "wrap",

                  >
                    <div

                        fontWeight: 700,

                      <button

                        style={{
                          padding: "0.4rem 0.875rem",
                          fontSize: "0.8rem",
                        }}
                      >
                        <Icon name="whatsapp" size={14} /> WhatsApp
                      </button>
                      <button
                        onClick={() => generateReceiptPDF(view)}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: "0.375rem",
                          padding: "0.5rem 0.875rem",
                          borderRadius: "8px",
                          background: "#0A3D91",
                          border: "none",
                          color: "white",

                        }}
                      >
                        <Icon name="download" size={14} /> PDF

                      <button

                          display: "flex",
                          alignItems: "center",
                          gap: "0.375rem",
                          padding: "0.5rem 0.875rem",
                          borderRadius: "8px",
                          background: "var(--bg)",
                          border: "1px solid var(--border)",

                          cursor: "pointer",
                          fontSize: "0.8rem",
                          fontWeight: 600,
                        }}
                      >
                        <Icon name="print" size={14} /> Print

                    display: "flex",

                    justifyContent: "center",
                    fontWeight: 800,
                    color: "white",
                    fontSize: "0.8rem",
                    flexShrink: 0,
                  }}
                >
                  {session.avatar}
                </div>
                <div className="seller-name" style={{ minWidth: 0 }}>
                  <div
                    style={{
                      fontSize: "0.78rem",
                      fontWeight: 700,
                      color: "var(--text)",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                      whiteSpace: "nowrap",
                    }}
                  >
                    {session.userName.split(" ")[0]}
                  </div>
                  <div
                    style={{
                      fontSize: "0.65rem",
                      color: "#60A5FA",
                      fontWeight: 600,
                    }}
                  >
                    MANAGER
                  </div>
                </div>
              </div>
            </div>
            <nav
              style={{
                flex: 1,
                padding: "0.75rem 0.75rem",
                display: "flex",
                flexDirection: "column",
                gap: "0.25rem",
                overflowY: "auto",
              }}
            >
              {navItems.map((item) => (
                <div
                  key={item.id}
                  className={`nav-item ${section === item.id ? "active" : ""}`}
                  onClick={() => onSection(item.id)}
                >
                  <Icon name={item.icon} size={17} />
                  <span className="nav-text" style={{ fontSize: "0.85rem" }}>
                    {item.label}
                  </span>
                </div>
              ))}
            </nav>
            <div
              style={{
                padding: "0.75rem",
                borderTop: "1px solid var(--border)",
              }}
            >
              <button
                onClick={onLogout}
                className="nav-item"
                style={{
                  width: "100%",
                  background: "none",
                  border: "none",
                  cursor: "pointer",
                  color: "#EF4444",
                  justifyContent: "flex-start",
                }}
              >
                <Icon name="logout" size={17} />
                <span className="nav-text" style={{ fontSize: "0.85rem" }}>
                  Sign Out
                </span>
              </button>
            </div>
          </div>
        );
      };

      const Dashboard = ({
        session,
        onLogout,
        theme,
        onThemeChange,
        addToast,
        dismissToast,
        toasts,
      }) => {
        const [section, setSection] = useState("overview");
        const [users, setUsers] = useState(() => {
          const stored = getUsers();
          return stored || DEFAULT_USERS;
        });
        const [products, setProducts] = useState(() => {
          const stored = getStoredData();
          return stored?.products || INITIAL_PRODUCTS;
        });
        const [sales, setSales] = useState(() => {
          const stored = getStoredData();
          return stored?.sales || INITIAL_SALES;
        });
        const [liveNotifs, setLiveNotifs] = useState([]);
        const [logs, setLogs] = useState([
          {
            type: "auth",
            action: "Manager logged in",
            detail: `${session.userName} signed in to Manager Portal`,
            timestamp: new Date().toISOString(),
          },
        ]);
        const [notifications, setNotifications] = useState([
          {
            icon: "📌",
            title: "Welcome back!",
            message: "All systems ready. No sales recorded yet.",
            timestamp: new Date().toISOString(),
            read: false,
          },
        ]);
        const [notifPanelOpen, setNotifPanelOpen] = useState(false);

        useEffect(() => {
          saveUsers(users);
        }, [users]);
        useEffect(() => {
          saveData({ products, sales });
        }, [products, sales]);

        // ─── DUAL-SYNC ENGINE (BroadcastChannel + LocalStorage + Supabase) ───
        useEffect(() => {
          // 1. Listen for Seller POS Broadcasts (Instant Multi-Tab / Local Sync)
          const unsubscribe = window.WD_STORE.subscribeBroadcast((msg) => {
            if (msg.type === "SALE_LOGGED" && msg.sale) {
              const sale = msg.sale;
              setSales((prev) => [sale, ...prev.filter((s) => s.id !== sale.id)]);
              setLiveNotifs((prev) => [sale, ...prev].slice(0, 20));

              if (Array.isArray(msg.products)) {
                setProducts(msg.products);
              } else {
                setProducts((prev) =>
                  prev.map((p) => {
                    const item = (sale.items || []).find((i) => i.productId === p.id);
                    return item ? { ...p, stock: Math.max(0, p.stock - item.qty) } : p;
                  })
                );
              }

              const firstItem = sale.items?.[0] || { name: "Products", qty: 1 };
              const itemSummary = `${firstItem.name} × ${firstItem.qty}${sale.items?.length > 1 ? ` (+${sale.items.length - 1} more)` : ""}`;

              setLogs((prev) => [
                {
                  type: "sale",
                  action: `⚡ Live Sale — ${sale.sellerName}`,
                  detail: `${itemSummary} | ${fmt(sale.total)} (${sale.payment})`,
                  timestamp: sale.timestamp,
                },
                ...prev,
              ]);

              addToast({
                type: "sale",
                title: `⚡ Live Sale Logged — ${sale.sellerName}`,
                message: `${itemSummary} · ${fmt(sale.total)}`,
              });

              setNotifications((prev) => [
                {
                  icon: "⚡",
                  title: `Live Sale — ${sale.sellerName}`,
                  message: `${itemSummary} · ${fmt(sale.total)}`,
                  timestamp: sale.timestamp,
                  read: false,
                },
                ...prev,
              ]);
            } else if (msg.type === "SYNC_INVENTORY" || msg.type === "DATA_UPDATED") {
              if (Array.isArray(msg.products)) setProducts(msg.products);
              if (Array.isArray(msg.sales)) setSales(msg.sales);
            }
          });

          // 2. Setup Supabase Realtime Listener (Cloud PostgreSQL Sync)
          const unsubSupabase = window.WD_STORE.setupSupabaseRealtime(
            (newSaleRow) => {
              window.WD_STORE.syncFromSupabase().then((res) => {
                if (res) {
                  setProducts(res.products);
                  setSales(res.sales);
                }
              });
            },
            (invChange) => {
              window.WD_STORE.syncFromSupabase().then((res) => {
                if (res) {
                  setProducts(res.products);
                  setSales(res.sales);
                }
              });
            }
          );

          // 3. Initial pull from Supabase if connected
          window.WD_STORE.syncFromSupabase().then((res) => {
            if (res) {
              setProducts(res.products);
              setSales(res.sales);
            }
          });

          return () => {
            if (unsubscribe) unsubscribe();
            if (unsubSupabase) unsubSupabase();
          };
        }, []);

        const handleInventoryUpdate = (updater) => {
          const newProducts = updater(products);
          setProducts(newProducts);
          setLogs((prev) => [
            {
              type: "inventory",
              action: "Inventory updated by manager",
              detail: `${session.userName} modified product catalog`,
              timestamp: new Date().toISOString(),
            },
            ...prev,
          ]);
          addToast({
            type: "success",
            title: "Inventory updated",
            message: "Changes saved and synced to Seller POS in real-time.",
          });
          setNotifications((prev) => [
            {
              icon: "📦",
              title: "Inventory Updated",
              message: "Product catalog was modified & synced",
              timestamp: new Date().toISOString(),
              read: false,
            },
            ...prev,
          ]);

          // 1. Save and broadcast to Seller POS
          window.WD_STORE.saveData({ products: newProducts, sales: sales }, true);
          window.WD_STORE.broadcastMessage({
            type: "SYNC_INVENTORY",
            products: newProducts,
            sales: sales,
          });

          // 2. Push all modified/new products to Supabase
          newProducts.forEach((p) => {
            window.WD_STORE.pushProductToSupabase(p);
          });
        };

        const handleUpdateUsers = (newUsers) => {
          setUsers(newUsers);
          setLogs((prev) => [
            {
              type: "auth",
              action: "User management updated",
              detail: `${session.userName} modified user accounts`,
              timestamp: new Date().toISOString(),
            },
            ...prev,
          ]);
          addToast({
            type: "success",
            title: "Users updated",
            message: "Changes saved successfully.",
          });
        };

        const markNotifRead = (index) => {
          setNotifications((prev) =>
            prev.map((n, i) => (i === index ? { ...n, read: true } : n)),
          );
        };
        const markAllRead = () => {
          setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
          addToast({
            type: "success",
            title: "All marked read",
            message: "Notifications cleared",
          });
        };
        const unreadCount = notifications.filter((n) => !n.read).length;

        return (
          <>
            <div
              style={{
                display: "flex",
                height: "100vh",
                overflow: "hidden",
                background: "var(--bg)",
              }}
            >
              <Sidebar
                section={section}
                onSection={setSection}
                session={session}
                onLogout={onLogout}
              />
              <div
                style={{
                  flex: 1,
                  display: "flex",
                  flexDirection: "column",
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    padding: "0.875rem 1.5rem",
                    borderBottom: "1px solid var(--border)",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    background: "var(--bg2)",
                    flexShrink: 0,
                    flexWrap: "wrap",
                    gap: "0.5rem",
                  }}
                >
                  <div>
                    <h1
                      className="font-heading"
                      style={{
                        fontSize: "1.1rem",
                        fontWeight: 800,
                        color: "var(--text)",
                      }}
                    >
                      {section === "overview"
                        ? "Dashboard Overview"
                        : section === "inventory"
                          ? "Inventory Management"
                          : section === "sales"
                            ? "Sales History"
                            : section === "analytics"
                              ? "Analytics & Reports"
                              : section === "employees"
                                ? "Employee Management"
                                : section === "logs"
                                  ? "Activity Logs"
                                  : "Settings"}
                    </h1>
                    <p
                      style={{
                        fontSize: "0.75rem",
                        color: "var(--text3)",
                        marginTop: "0.125rem",
                      }}
                    >
                      White Dove Engineering Firm · Manager Portal
                    </p>
                  </div>
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: "0.875rem",
                      flexWrap: "wrap",
                    }}
                  >
                    <div
                      style={{
                        display: "flex",
                        background: "var(--bg)",
                        border: "1px solid var(--border)",
                        borderRadius: "10px",
                        overflow: "hidden",
                      }}
                    >
                      {[
                        { val: "dark", icon: "moon" },
                        { val: "light", icon: "sun" },
                        { val: "system", icon: "monitor" },
                      ].map((t) => (
                        <button
                          key={t.val}
                          onClick={() => onThemeChange(t.val)}
                          style={{
                            padding: "0.5rem",
                            background:
                              theme === t.val
                                ? "rgba(10,61,145,0.2)"
                                : "transparent",
                            border: "none",
                            color: theme === t.val ? "#60A5FA" : "var(--text3)",
                            cursor: "pointer",
                          }}
                        >
                          <Icon name={t.icon} size={15} />
                        </button>
                      ))}
                    </div>
                    <div
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: "0.375rem",
                        fontSize: "0.75rem",
                        fontWeight: 600,
                        color: "#10B981",
                        background: "rgba(16,185,129,0.1)",
                        border: "1px solid rgba(16,185,129,0.2)",
                        padding: "0.375rem 0.75rem",
                        borderRadius: "100px",
                      }}
                    >
                      <div
                        className="pulse-dot"
                        style={{ width: "6px", height: "6px" }}
                      />
                      Live
                    </div>
                    <button
                      onClick={() => setNotifPanelOpen(true)}
                      style={{
                        position: "relative",
                        background: "var(--bg)",
                        border: "1px solid var(--border)",
                        borderRadius: "10px",
                        padding: "0.5rem",
                        cursor: "pointer",
                        color: "var(--text2)",
                      }}
                    >
                      <Icon name="bell" size={17} />
                      {unreadCount > 0 && (
                        <span
                          style={{
                            position: "absolute",
                            top: "-4px",
                            right: "-4px",
                            minWidth: "16px",
                            height: "16px",
                            background: "#EF4444",
                            color: "white",
                            borderRadius: "50%",
                            fontSize: "0.6rem",
                            fontWeight: 800,
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            padding: "0 3px",
                          }}
                        >
                          {unreadCount > 9 ? "9+" : unreadCount}
                        </span>
                      )}
                    </button>
                  </div>
                </div>
                <div style={{ flex: 1, overflowY: "auto", padding: "1.5rem" }}>
                  {section === "overview" && (
                    <OverviewSection
                      products={products}
                      sales={sales}
                      theme={theme}
                      liveNotifs={liveNotifs}
                      addToast={addToast}
                    />
                  )}
                  {section === "inventory" && (
                    <InventorySection
                      products={products}
                      onUpdate={handleInventoryUpdate}
                    />
                  )}
                  {section === "sales" && <SalesSection sales={sales} />}
                  {section === "analytics" && (
                    <AnalyticsSection
                      products={products}
                      sales={sales}
                      theme={theme}
                    />
                  )}
                  {section === "employees" && (
                    <EmployeeManagement
                      users={users}
                      onUpdateUsers={handleUpdateUsers}
                      currentUser={session}
                    />
                  )}
                  {section === "logs" && <LogsSection logs={logs} />}
                  {section === "settings" && (
                    <SettingsSection
                      theme={theme}
                      onThemeChange={onThemeChange}
                      session={session}
                    />
                  )}
                </div>
              </div>
            </div>
            <NotificationPanel
              isOpen={notifPanelOpen}
              onClose={() => setNotifPanelOpen(false)}
              notifications={notifications}
              onMarkRead={markNotifRead}
              onMarkAllRead={markAllRead}
            />
          </>
        );
      };

      const App = () => {
        const [session, setSession] = useState(() => getSession());
        const [theme, setTheme] = useState(
          () => localStorage.getItem("wd_theme") || "dark",
        );
        const [toasts, setToasts] = useState([]);

        const applyTheme = useCallback((t) => {
          const resolved =
            t === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : t;
          document.documentElement.setAttribute("data-theme", resolved);
          setTheme(t);
          localStorage.setItem("wd_theme", t);
        }, []);

        useEffect(() => {
          applyTheme(theme);
        }, []);

        const addToast = useCallback((toast) => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [{ ...toast, id }, ...prev].slice(0, 5));
          setTimeout(
            () => setToasts((prev) => prev.filter((t) => t.id !== id)),
            5000,
          );
        }, []);

        const dismissToast = useCallback(
          (id) => setToasts((prev) => prev.filter((t) => t.id !== id)),
          [],
        );

        const handleLogout = useCallback(() => {
          sessionStorage.removeItem(AUTH_KEY);
          localStorage.removeItem(AUTH_KEY + "_remember");
          setSession(null);
        }, []);

        return (
          <>
            <ToastContainer toasts={toasts} onDismiss={dismissToast} />
            {!session ? (
              <LoginPage
                onLogin={(s) => {
                  setSession(s);
                  addToast({
                    type: "success",
                    title: "Welcome back!",
                    message: `Signed in as ${s.userName}`,
                  });
                }}
              />
            ) : (
              <Dashboard
                session={session}
                onLogout={handleLogout}
                theme={theme}
                onThemeChange={applyTheme}
                addToast={addToast}
                dismissToast={dismissToast}
                toasts={toasts}
              />
            )}
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
